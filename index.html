<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng Đấu Dây</title>
<meta name="theme-color" content="#0f3290">
<meta name="description" content="Xưởng Đấu Dây – mô phỏng đấu dây điện công nghiệp, dân dụng và sơ đồ nguyên lý">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xưởng Đấu Dây">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: xưởng thực hành nghề điện — rõ ràng, chắc tay, như bàn tập của giáo viên dạy nghề.
   IDEA: tấm đế gắn thiết bị (mounting plate) bằng thép mạ có thanh ray DIN, dây điện thật đúng màu pha.
   PICTURE: tấm đế với aptomat, contactor đang hút, đèn sáng, động cơ quay — chính là bàn mô phỏng.
   COLOUR and TYPE: trắng + xanh cobalt của tủ điện công nghiệp, thép xám, cam tín hiệu cho phần đang có điện; Be Vietnam Pro.
   LAYOUT: dải xanh tiêu đề + tấm đế; hàng chế độ làm việc; dải bài mẫu cuộn ngang; tra cứu. Bàn làm việc toàn màn hình. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1318);--ink:light-dark(#141b24,#e9eef4);--mut:light-dark(#566271,#9aa6b4);--line:light-dark(#d9dee4,#2a323d);
--co:light-dark(#1747c4,#3f74ff);--co2:light-dark(#0f3290,#1b3a99);--soft:light-dark(#f2f4f7,#161c23);--card:light-dark(#ffffff,#171d25);
--plate:light-dark(#e3e7eb,#1d242d);--plated:light-dark(#c8ced5,#2c3540);--live:#ff6a14;--ok:#1c9e4a;--bad:#d8341f;
--wcase:light-dark(rgba(0,0,0,.28),rgba(0,0,0,.55))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--co)}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;padding:max(10px,env(safe-area-inset-top)) max(4vw,14px) 10px;background:var(--co2);color:#fff;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff;text-decoration:none;white-space:nowrap}
.logo svg{flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.nav a{flex:none;color:#dfe7ff;text-decoration:none;padding:9px 12px;border-radius:8px;white-space:nowrap;font-weight:500;font-size:15px}
.nav a.on,.nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.band{padding:clamp(24px,4vw,52px) max(4vw,14px);max-width:1240px;margin:0 auto}
.band.alt{max-width:none;background:var(--soft)}.band.alt>*{max-width:1240px;margin-left:auto;margin-right:auto}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0 0 12px}
h1{font-size:clamp(34px,5vw,50px);font-weight:800}h2{font-size:22px;font-weight:700}h3{font-size:17px}
.pt{font-size:clamp(30px,4vw,40px)}.lead{color:var(--mut);max-width:68ch;margin:0 0 18px}
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center;max-width:none;background:var(--co);color:#fff}
.hero>*{max-width:620px}.hero-t{justify-self:end}
.hero p{font-size:17px;color:#e3eaff;max-width:52ch}
.hero-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.3))}
.plate{fill:#dfe3e8;stroke:#aeb6bf}.pdot{fill:#aab2bb}.din{fill:#b9c0c8;stroke:#98a1ab}.hw{fill:none;stroke:#d7322a;stroke-width:3.5;stroke-linecap:round}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}.wrap{flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--co)}.btn.primary{background:var(--live);border-color:var(--live);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn.danger{color:var(--bad)}.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.mode:hover{border-color:var(--co);box-shadow:0 8px 24px rgba(23,71,196,.12)}
.mi{flex:none;width:72px;height:72px;border-radius:12px;background:var(--plate);display:grid;place-items:center}
.mt{display:flex;flex-direction:column;gap:3px}.mt b{font-size:17px}.mt span{color:var(--mut);font-size:14px;line-height:1.4}
.plus{margin-left:auto;font-size:24px;color:var(--co);flex:none}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.hrow a{font-weight:600;white-space:nowrap}
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.tcard{flex:0 0 260px;scroll-snap-align:start;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:0;overflow:hidden;cursor:pointer}
.tcard:hover{border-color:var(--co)}
.thumb{display:block;width:100%;height:170px;background:var(--plate);border:0;padding:8px;cursor:pointer}.thumb svg{width:100%;height:100%}
.tc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}.tc-b b{font-size:15px;line-height:1.3}
.tc-cat{font-size:13px;color:var(--co);font-weight:600}
.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ref{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);background:var(--card)}
.ref:hover{border-color:var(--co)}.ref>svg{flex:none;background:var(--plate);border-radius:10px;padding:4px;width:68px;height:68px}
.ref span{display:flex;flex-direction:column;gap:2px}.ref span span{color:var(--mut);font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:28px}
.tbig{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.tbig .thumb{height:220px}.tb-b{padding:14px 16px 16px}.tb-b p{color:var(--mut);font-size:15px;margin:6px 0 4px}
.search{width:100%;max-width:520px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);padding:0 14px;background:var(--card);font-size:16px;margin-bottom:8px}
.lg{margin-top:26px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.lcard{display:grid;grid-template-columns:170px minmax(0,1fr);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.lpic{background:var(--plate);display:grid;place-items:center;padding:10px}.lpic svg{width:100%;max-height:220px}
.lb{padding:14px 16px}.lb p{margin:4px 0 8px;font-size:15px;color:var(--mut)}
.terms{display:flex;flex-wrap:wrap;gap:5px}.terms span{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--soft);border:1px solid var(--line);font-weight:600}
.syms{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.syms figure{margin:0;text-align:center;font-size:13px;color:var(--mut);width:70px}.syms svg{background:var(--soft);border-radius:8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.scard{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}.scard h3{font-size:15px;margin:8px 0 4px}.scard p{font-size:14px;color:var(--mut);margin:0}
.spic{height:96px;display:grid;place-items:center;background:var(--soft);border-radius:8px;color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.prow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--card)}
.pthumb{height:80px;border:0;border-radius:8px;background:var(--plate);padding:4px;cursor:pointer}.pthumb svg{width:100%;height:100%}
.pinfo{display:flex;flex-direction:column}.pinfo span{color:var(--mut);font-size:14px}.pact{display:flex;gap:6px;flex-wrap:wrap}
.empty,.muted{color:var(--mut);font-size:14px}
.imp{margin-top:22px;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px}.imp summary{cursor:pointer;font-weight:600}
textarea{width:100%;border-radius:10px;border:1.5px solid var(--line);padding:10px;background:var(--card);font-size:14px}
footer{padding:26px max(4vw,14px);color:var(--mut);font-size:14px;border-top:1px solid var(--line);text-align:center}
/* ===== bàn làm việc ===== */
body.editing{overflow:hidden}
.ed{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.edbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--co2);color:#fff}
.edbar .ib{min-width:44px;min-height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:700;cursor:pointer;padding:0 12px;font-size:15px;white-space:nowrap}
.edbar .ib:disabled{opacity:.4}.edbar .ib.on{background:#fff;color:var(--co2)}
#runbtn{background:var(--live);min-width:96px}#runbtn.on{background:#fff;color:var(--bad)}
#ed-name{flex:1 1 140px;min-width:80px;max-width:340px;min-height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.15);color:#fff;padding:0 10px;font-size:16px;font-weight:600}
#ed-mode{font-size:13px;color:#c9d6ff;white-space:nowrap}
.edbody{flex:1;display:flex;min-height:0}
.pal{width:236px;flex:none;overflow-y:auto;border-right:1px solid var(--line);background:var(--soft);padding:8px 8px 40px}
.pal.locked{opacity:.45;pointer-events:none}
.pg h4{margin:10px 4px 6px;font-size:13px;color:var(--mut);font-weight:600}
.pis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;line-height:1.2;text-align:center;min-height:80px}
.pi:hover{border-color:var(--co)}
.stage{position:relative;flex:1;overflow:hidden;background:var(--plate);background-image:radial-gradient(var(--plated) 1.2px,transparent 1.3px);background-size:20px 20px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.schv,.stage:has(#cv.schv){background-color:light-dark(#fbfbf8,#12171d)}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 80px)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[data-c=pe],.sw[data-wc=pe]{background:repeating-linear-gradient(45deg,#3aa845 0 6px,#f0d000 6px 12px)}
.sw.on{box-shadow:0 0 0 3px var(--live)}.sw.big{width:40px;height:40px}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.status{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.status>*{pointer-events:auto;max-width:640px}
.hint{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--mut)}
.fault{background:#fff1ec;color:#9b2410;border:1px solid #f6b9a6;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.meter{display:flex;flex-direction:column;background:#1b2028;color:#c9ff5a;border-radius:12px;padding:10px 14px;border:3px solid #f2c200;font-variant-numeric:tabular-nums}
.meter b{font-size:24px}.meter span{color:#d9dee6;font-size:13px}
.sheet,.guide{position:absolute;right:64px;top:64px;width:300px;max-height:calc(100% - 150px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.18);z-index:3}
.guide{left:10px;right:auto;top:52px;width:320px}
.guide summary{cursor:pointer;font-size:15px;list-style-position:inside}.guide details:not([open]) summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.guide ol{margin:4px 0 0;padding-left:20px;font-size:14px}.guide li{margin:4px 0}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sh-h b{font-size:15px;line-height:1.25}.sh-h span{color:var(--co);font-weight:700;font-size:14px}
.x{margin-left:auto;width:36px;height:36px;border-radius:8px;border:0;background:var(--soft);cursor:pointer;flex:none}
.form{display:flex;flex-direction:column;gap:8px}.form label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.chk{flex-direction:row!important;align-items:center;gap:10px!important;font-size:15px!important;color:var(--ink)!important}.chk input{width:22px;height:22px;min-height:0!important}
.form input,.form select{min-height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px;color:var(--ink)}
.info{font-size:14px;margin-top:10px;padding:10px;border-radius:8px;background:var(--soft)}
.sm-only{display:none}
/* ===== SVG linh kiện ===== */
svg text{font-family:"Be Vietnam Pro",system-ui,sans-serif}
.b-light{fill:#f4f5f2;stroke:#9aa3ad;stroke-width:1.3}.b-dark{fill:#2b3038;stroke:#151a20}.b-darker{fill:#1d2127}.b-shade{fill:#dfe2e0;stroke:#b8bec4}
.b-base{fill:#3a4049;stroke:#1d2228}.b-metal{fill:#c6ccd2;stroke:#8d959e}.b-face{fill:#e9ecef;stroke:#a7afb7}.b-yellow{fill:#f3c623;stroke:#b48c00}
.b-screen{fill:#1a2a1f;stroke:#0c140f}.lcd{fill:#9dff6a;font-size:11px;font-weight:700}
.pl{fill:#2a313a;font-size:11px;font-weight:600}.pl-w{fill:#fff;font-size:10px;font-weight:700}.pl-s{fill:#5d6672;font-size:10px;font-weight:600}
.pl-o{fill:var(--live);font-size:11px;font-weight:800}.pl-r{fill:#e5352b;font-size:11px;font-weight:800}.pl-g{fill:#1c9e4a;font-size:11px;font-weight:800}
.tag{fill:var(--co);font-size:13px;font-weight:800}
.fins rect{fill:#a9b1ba}
.led-on{fill:#3cff6e;filter:drop-shadow(0 0 4px #3cff6e)}.led-off{fill:#3a4a3f}.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.b-slot{fill:#161a1f}.h-on{fill:#e9ecef}.h-off{fill:#9aa2ab}.h-trip{fill:#ff8a3d}
.btn-test{fill:#f3c623}.btn-red{fill:#d8341f}.btn-blue{fill:#2166e0}
.plg-off{fill:#9aa2ab}.plg-on{fill:var(--live)}
.burnt circle{fill:rgba(20,20,20,.75)}.burnt path{stroke:#ff6a14;stroke-width:4;stroke-linecap:round}
.b-clear{fill:rgba(210,225,240,.35);stroke:#9fb2c4}.coilbox{fill:#b87333;stroke:#7a4a1f}.coilbox.on{fill:#ff8a3d}
.dialtrack{fill:none;stroke:#c0c7ce;stroke-width:5;stroke-linecap:round}.needle{stroke:#d8341f;stroke-width:3;stroke-linecap:round}
.b-bezel{fill:#c3c9cf;stroke:#7f8892}.btnface{stroke:rgba(0,0,0,.35);stroke-width:1.5}.knob{fill:#2b3038}.lever{stroke:#2b3038;stroke-width:5;stroke-linecap:round}
.glow{opacity:.45;filter:blur(5px)}.lens{opacity:.45;stroke:rgba(0,0,0,.3)}.lens.on{opacity:1}
.wave{fill:none;stroke:#8b939c;stroke-width:1.5}.wave.on{stroke:var(--live);animation:bl .4s steps(2) infinite}
.b-motor{fill:#3c6fb6;stroke:#24497e}.mfin{fill:#2f5c9c}.rotor{fill:#24497e;stroke:#162f55}.rotor.on{fill:#2b5799}.blade{fill:#d8e3f2}
.b-tbox{fill:#2f5c9c;stroke:#1d3d6c}.b-tb{fill:#9aa2ab;stroke:#6d757e}.screw{fill:#d7dce1;stroke:#6d757e}
.b-plate{fill:#fbfbf8;stroke:#b9bfc5;stroke-width:1.4}.rocker{fill:#e9ecef;stroke:#aab2ba}.rocker-hi{fill:#fff;stroke:#c4cad0}
.hole{fill:#30353c}.plug{fill:#59616c}.plug.on{fill:#1c9e4a}
.halo{fill:#ffd65a;opacity:.35;filter:blur(8px)}.bulb{fill:rgba(225,232,240,.7);stroke:#8d959e;stroke-width:1.5}.bulb.on{fill:#fff1a8;stroke:#e0b400}
.filament{fill:none;stroke:#7d858e;stroke-width:1.5}.filament.on{stroke:#ff8a00}.thin{stroke-width:1}
.fanb{fill:#c6ccd2;stroke:#8d959e}.fanb.on{fill:#9fc4ff}
.bell{fill:#c6ccd2;stroke:#8d959e}.bell.on{fill:#ffd65a;animation:bl .3s steps(2) infinite}.btn-door{fill:#f3c623;stroke:#b48c00}
.sl{stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}.sl.fillk{fill:var(--ink)}.nofill{fill:none}.dash{stroke-dasharray:4 4}
.live-s{stroke:var(--live)!important;stroke-width:2.6}.fill-live{fill:rgba(255,106,20,.28)}
.sym{fill:var(--ink);font-size:22px;font-weight:700}
.rail{stroke:var(--ink);stroke-width:3.5}
.schv .pl,.schv .pl-s{fill:var(--mut)}
/* dây & cực */
.whit{stroke:transparent;stroke-width:16;fill:none}.wcase{stroke:var(--wcase);stroke-width:7;fill:none;stroke-linecap:round}
.wcore{stroke-width:4.4;fill:none;stroke-linecap:round}.wcore.thin{stroke-width:2}
.wsw{display:inline-block;flex:none;width:34px;height:12px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--c) 0 6px,var(--s) 6px 12px,var(--c) 12px 18px,var(--s2) 18px 24px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.18)}
.wsw.big{width:56px;height:16px;border-radius:8px}
.wpick{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;max-width:300px}
.wpick span{display:flex;flex-direction:column;line-height:1.2}.wpick b{font-size:14px}.wpick small{color:var(--mut);font-size:12px}
.wsheet{position:absolute;inset:0;z-index:6;background:rgba(10,14,20,.35);display:flex;justify-content:center;align-items:flex-end}
.wbox{background:var(--card);width:min(560px,100%);max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px 24px;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.wbox h4{margin:14px 0 6px;font-size:13px;color:var(--co)}
.wlist{display:flex;flex-direction:column;gap:6px}
.witem{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px}
.witem.on{border-color:var(--live);box-shadow:0 0 0 2px rgba(255,106,20,.25)}
.witem>button:first-child{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;text-align:left;cursor:pointer;min-height:52px}
.witem span{display:flex;flex-direction:column;line-height:1.3}.witem b{font-size:15px}.witem small{color:var(--mut);font-size:13px}

<script>
/* ===== Xưởng Đấu Dây — lõi mô phỏng + định nghĩa linh kiện ===== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = {};
function def(type, o) { P[type] = Object.assign({ type, props: [], cats: [] }, o); }
function termsOf(p) { const d = P[p.type]; return typeof d.terms === 'function' ? d.terms(p) : d.terms; }
function T(S, tag) { return S[tag] || (S[tag] = { coil: false, since: 0, pressed: false, act: false, on: true, tripped: false, delay: 5, psu: false }); }

/* ---------- vẽ dùng chung ---------- */
const box = (w, h, cls = 'b-light', r = 6, x = 0, y = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${cls}"/>`;
const txt = (x, y, s, cls = 'pl', anchor = 'middle') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const LAMPC = { green: '#22b24c', red: '#e5352b', yellow: '#f4c21b', white: '#f3f1e8', blue: '#2f7de1', orange: '#ff7a1a' };
const VOPT = [{ v: '230AC', l: '230 V AC' }, { v: '24DC', l: '24 V DC' }];
const COLOPT = [{ v: 'green', l: 'Xanh lá' }, { v: 'red', l: 'Đỏ' }, { v: 'yellow', l: 'Vàng' }, { v: 'white', l: 'Trắng' }, { v: 'blue', l: 'Xanh dương' }];

/* tiếp điểm IEC (dọc), x tâm = cx, từ y0 tới y1 */
function sContact(cx, y0, y1, kind, closed, opt = {}) {
  const m = (y0 + y1) / 2, a = m - 12, b = m + 12;
  let s = `<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${a}" class="sl"/><line x1="${cx}" y1="${b}" x2="${cx}" y2="${y1}" class="sl"/>`;
  const cl = closed ? 'sl live-s' : 'sl';
  if (kind === 'no') {
    s += closed ? `<line x1="${cx}" y1="${b}" x2="${cx - 2}" y2="${a}" class="${cl}"/>` : `<line x1="${cx}" y1="${b}" x2="${cx - 13}" y2="${a + 3}" class="${cl}"/>`;
  } else {
    s += `<line x1="${cx}" y1="${a}" x2="${cx + 9}" y2="${a}" class="sl"/>`;
    s += closed ? `<line x1="${cx}" y1="${b}" x2="${cx + 9}" y2="${a - 1}" class="${cl}"/>` : `<line x1="${cx}" y1="${b}" x2="${cx - 13}" y2="${a + 3}" class="${cl}"/>`;
  }
  if (opt.brk) s += `<path d="M${cx - 4} ${a - 4}l8 8m0-8l-8 8" class="sl"/>`;
  const ax = cx - 7, ay = m;
  if (opt.push) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 26}" y2="${ay}" class="sl dash"/><path d="M${cx - 26} ${ay - 6}v12M${cx - 26} ${ay - 6}h-4M${cx - 26} ${ay + 6}h-4" class="sl"/>`;
  if (opt.estop) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 24}" y2="${ay}" class="sl dash"/><path d="M${cx - 24} ${ay - 7}a7 7 0 0 0 0 14z" class="sl fillk"/>`;

function motorDraw(p, v, w, h, cx, cy, label) {
  const run = v.motor && v.motor.run, a = v.ang || 0;
  return `<rect x="${cx - 62}" y="${cy - 40}" width="124" height="86" rx="10" class="b-motor"/>` + [0, 1, 2, 3, 4, 5, 6].map(i => `<rect x="${cx - 54 + i * 16}" y="${cy - 40}" width="6" height="86" class="mfin"/>`).join('') +
    `<rect x="${cx + 62}" y="${cy - 6}" width="22" height="12" rx="2" class="b-metal"/>` +
    `<g transform="translate(${cx} ${cy + 3}) rotate(${a})"><circle r="26" class="${run ? 'rotor on' : 'rotor'}"/><path d="M0-22L5-4 22 0 4 5 0 22-5 4-22 0-4-5z" class="blade"/></g>` +
    `<rect x="${cx - 46}" y="${cy + 46}" width="92" height="10" rx="2" class="b-dark"/>` + txt(cx, cy + 72, label, run ? 'pl-o' : 'pl-s');
}
function motorStatus(m) {
  if (!m) return 'Dừng';
  if (m.run) return (m.mode === 'star' ? 'Chạy SAO (Y)' : m.mode === 'delta' ? 'Chạy TAM GIÁC (Δ)' : m.mode === 'low' ? 'Tốc độ THẤP' : m.mode === 'high' ? 'Tốc độ CAO' : 'Đang chạy') + (m.dir ? (m.dir > 0 ? ' · Thuận' : ' · Ngược') : '');
  if (m.pl) return 'MẤT PHA – kêu ù!';
  return m.msg || 'Dừng';
}

/* ===== Bài mẫu ===== */
function mk(mode) {
  const pr = { mode, parts: [], wires: [], n: 1 };
  const cnt = {};
  pr.add = (type, x, y, o = {}) => {
    const d = P[type]; const id = 'p' + (pr.n++);
    const p = Object.assign({ id, type, x, y }, o);
    if (!p.tag && !d.noTag) { cnt[d.prefix] = (cnt[d.prefix] || 0) + 1; p.tag = d.prefix + cnt[d.prefix]; }
    for (const pp of d.props) if (p[pp.k] === undefined) p[pp.k] = pp.d;
    pr.parts.push(p); return id;
  };
  pr.w = (a, ta, b, tb, c) => { pr.wires.push({ id: 'w' + (pr.n++), a: a + ':' + ta, b: b + ':' + tb, c: c || (mode === 'sch' ? 'ink' : 'red') }); };
  return pr;
}
const C = { L1: 'brown', L2: 'black', L3: 'grey', N: 'blue', PE: 'pe', K: 'red' };
function fin(pr, meta) { delete pr.add; delete pr.w; return Object.assign(pr, meta); }

}

function importJSON(text) {
  try {
    const o = JSON.parse(text);
    if (!o || !MODES[o.mode] || !Array.isArray(o.parts) || !Array.isArray(o.wires)) throw 0;
    o.parts = o.parts.filter(p => p && P[p.type] && typeof p.id === 'string').map(p => ({ ...p, x: +p.x || 0, y: +p.y || 0, tag: String(p.tag || '').slice(0, 8) }));
    o.wires = o.wires.filter(w => w && typeof w.a === 'string' && typeof w.b === 'string').map(w => ({ id: String(w.id), a: w.a, b: w.b, c: typeof w.c === 'string' && (/^#[0-9a-f]{6}$/i.test(w.c) || /^[a-zA-Z]{2,12}$/.test(w.c)) ? w.c : 'red' }));
    const pr = newProj(o.mode, o); pr.name = String(o.name || 'Dự án nhập').slice(0, 60); pr.n = Math.max(+o.n || 1, pr.parts.length + pr.wires.length + 2);
    proj = pr; saveProj(); return pr;
  } catch (e) { return null; }
}
function route() {

    if (!proj) { const last = LS.get('xdd.last', null), x = listProjects().find(p => p.id === last); if (x) { openEditor(x); return; } location.hash = 'home'; return; }
    ed.hidden = false; document.body.classList.add('editing'); if (needFit) { needFit = false; requestAnimationFrame(fit); } else draw(); status(); return;
  }
  if (running) stopRun();
  ed.hidden = true; document.body.classList.remove('editing');
  main.innerHTML = ({ home: pageHome, mau: pageTemplates, linhkien: pageLibrary, kyhieu: pageSymbols, duan: pageProjects }[h] || pageHome)();
  window.scrollTo(0, 0);
  if (h === 'home' || !h) heroAnim();
}
let heroRaf = 0;
function heroAnim() {

  let a = 0, last = performance.now();
  const f = t => { const g = document.getElementById('heromotor'); if (!g) return; a = (a + (t - last) * 0.4) % 360; last = t; const r = g.querySelector('g[transform*="rotate"]'); if (r) r.setAttribute('transform', r.getAttribute('transform').replace(/rotate\([^)]*\)/, `rotate(${a})`)); heroRaf = requestAnimationFrame(f); };
  heroRaf = requestAnimationFrame(f);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tpl],[data-new],[data-open],[data-export],[data-delp],#impb,#copyb');
  if (!t) return;

  if (t.dataset.new) { openEditor(newProj(t.dataset.new)); saveProj(); return; }
  if (t.dataset.open) { const x = listProjects().find(p => p.id === t.dataset.open); if (x) openEditor(x); return; }
  if (t.dataset.export) { const x = listProjects().find(p => p.id === t.dataset.export); if (!x) return; const { tpl, ...o } = x; $('#expbox').hidden = false; $('#expt').value = JSON.stringify(o); $('#expbox').scrollIntoView({ behavior: 'smooth' }); return; }

});

document.addEventListener('input', e => {
