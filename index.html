<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng Đấu Dây</title>
<meta name="theme-color" content="#0f3290">
<meta name="description" content="Xưởng Đấu Dây – mô phỏng đấu dây điện công nghiệp, dân dụng, PLC và sơ đồ nguyên lý">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xưởng Đấu Dây">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: xưởng thực hành nghề điện — rõ ràng, chắc tay, như bàn tập của giáo viên dạy nghề.
   IDEA: tấm đế gắn thiết bị (mounting plate) bằng thép mạ có thanh ray DIN, dây điện thật đúng màu pha.
   PICTURE: tấm đế với aptomat, contactor đang hút, đèn sáng, động cơ quay — chính là bàn mô phỏng.
   COLOUR and TYPE: trắng + xanh cobalt của tủ điện công nghiệp, thép xám, cam tín hiệu cho phần đang có điện; Be Vietnam Pro.
   LAYOUT: dải xanh tiêu đề + tấm đế; hàng chế độ làm việc; dải bài mẫu cuộn ngang; tra cứu. Bàn làm việc toàn màn hình. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1318);--ink:light-dark(#141b24,#e9eef4);--mut:light-dark(#566271,#9aa6b4);--line:light-dark(#d9dee4,#2a323d);
--co:light-dark(#1747c4,#3f74ff);--co2:light-dark(#0f3290,#1b3a99);--soft:light-dark(#f2f4f7,#161c23);--card:light-dark(#ffffff,#171d25);
--plate:light-dark(#e3e7eb,#1d242d);--plated:light-dark(#c8ced5,#2c3540);--live:#ff6a14;--ok:#1c9e4a;--bad:#d8341f;
--wcase:light-dark(rgba(0,0,0,.28),rgba(0,0,0,.55))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--co)}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;padding:max(10px,env(safe-area-inset-top)) max(4vw,14px) 10px;background:var(--co2);color:#fff;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff;text-decoration:none;white-space:nowrap}
.logo svg{flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.nav a{flex:none;color:#dfe7ff;text-decoration:none;padding:9px 12px;border-radius:8px;white-space:nowrap;font-weight:500;font-size:15px}
.nav a.on,.nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.band{padding:clamp(24px,4vw,52px) max(4vw,14px);max-width:1240px;margin:0 auto}
.band.alt{max-width:none;background:var(--soft)}.band.alt>*{max-width:1240px;margin-left:auto;margin-right:auto}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0 0 12px}
h1{font-size:clamp(34px,5vw,50px);font-weight:800}h2{font-size:22px;font-weight:700}h3{font-size:17px}
.pt{font-size:clamp(30px,4vw,40px)}.lead{color:var(--mut);max-width:68ch;margin:0 0 18px}
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center;max-width:none;background:var(--co);color:#fff}
.hero>*{max-width:620px}.hero-t{justify-self:end}
.hero p{font-size:17px;color:#e3eaff;max-width:52ch}
.hero-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.3))}
.plate{fill:#dfe3e8;stroke:#aeb6bf}.pdot{fill:#aab2bb}.din{fill:#b9c0c8;stroke:#98a1ab}.hw{fill:none;stroke:#d7322a;stroke-width:3.5;stroke-linecap:round}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}.wrap{flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--co)}.btn.primary{background:var(--live);border-color:var(--live);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn.danger{color:var(--bad)}.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.mode:hover{border-color:var(--co);box-shadow:0 8px 24px rgba(23,71,196,.12)}
.mi{flex:none;width:72px;height:72px;border-radius:12px;background:var(--plate);display:grid;place-items:center}
.mt{display:flex;flex-direction:column;gap:3px}.mt b{font-size:17px}.mt span{color:var(--mut);font-size:14px;line-height:1.4}
.plus{margin-left:auto;font-size:24px;color:var(--co);flex:none}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.hrow a{font-weight:600;white-space:nowrap}
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.tcard{flex:0 0 260px;scroll-snap-align:start;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:0;overflow:hidden;cursor:pointer}
.tcard:hover{border-color:var(--co)}
.thumb{display:block;width:100%;height:170px;background:var(--plate);border:0;padding:8px;cursor:pointer}.thumb svg{width:100%;height:100%}
.tc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}.tc-b b{font-size:15px;line-height:1.3}
.tc-cat{font-size:13px;color:var(--co);font-weight:600}
.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ref{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);background:var(--card)}
.ref:hover{border-color:var(--co)}.ref>svg{flex:none;background:var(--plate);border-radius:10px;padding:4px;width:68px;height:68px}
.ref span{display:flex;flex-direction:column;gap:2px}.ref span span{color:var(--mut);font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:28px}
.tbig{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.tbig .thumb{height:220px}.tb-b{padding:14px 16px 16px}.tb-b p{color:var(--mut);font-size:15px;margin:6px 0 4px}
.search{width:100%;max-width:520px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);padding:0 14px;background:var(--card);font-size:16px;margin-bottom:8px}
.lg{margin-top:26px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.lcard{display:grid;grid-template-columns:170px minmax(0,1fr);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.lpic{background:var(--plate);display:grid;place-items:center;padding:10px}.lpic svg{width:100%;max-height:220px}
.lb{padding:14px 16px}.lb p{margin:4px 0 8px;font-size:15px;color:var(--mut)}
.terms{display:flex;flex-wrap:wrap;gap:5px}.terms span{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--soft);border:1px solid var(--line);font-weight:600}
.syms{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.syms figure{margin:0;text-align:center;font-size:13px;color:var(--mut);width:70px}.syms svg{background:var(--soft);border-radius:8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.scard{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}.scard h3{font-size:15px;margin:8px 0 4px}.scard p{font-size:14px;color:var(--mut);margin:0}
.spic{height:96px;display:grid;place-items:center;background:var(--soft);border-radius:8px;color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.prow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--card)}
.pthumb{height:80px;border:0;border-radius:8px;background:var(--plate);padding:4px;cursor:pointer}.pthumb svg{width:100%;height:100%}
.pinfo{display:flex;flex-direction:column}.pinfo span{color:var(--mut);font-size:14px}.pact{display:flex;gap:6px;flex-wrap:wrap}
.empty,.muted{color:var(--mut);font-size:14px}
.imp{margin-top:22px;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px}.imp summary{cursor:pointer;font-weight:600}
textarea{width:100%;border-radius:10px;border:1.5px solid var(--line);padding:10px;background:var(--card);font-size:14px}
footer{padding:26px max(4vw,14px);color:var(--mut);font-size:14px;border-top:1px solid var(--line);text-align:center}
/* ===== bàn làm việc ===== */
body.editing{overflow:hidden}
.ed{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.edbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--co2);color:#fff}
.edbar .ib{min-width:44px;min-height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:700;cursor:pointer;padding:0 12px;font-size:15px;white-space:nowrap}
.edbar .ib:disabled{opacity:.4}.edbar .ib.on{background:#fff;color:var(--co2)}
#runbtn{background:var(--live);min-width:96px}#runbtn.on{background:#fff;color:var(--bad)}
#ed-name{flex:1 1 140px;min-width:80px;max-width:340px;min-height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.15);color:#fff;padding:0 10px;font-size:16px;font-weight:600}
#ed-mode{font-size:13px;color:#c9d6ff;white-space:nowrap}
.edbody{flex:1;display:flex;min-height:0}
.pal{width:236px;flex:none;overflow-y:auto;border-right:1px solid var(--line);background:var(--soft);padding:8px 8px 40px}
.pal.locked{opacity:.45;pointer-events:none}
.pg h4{margin:10px 4px 6px;font-size:13px;color:var(--mut);font-weight:600}
.pis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;line-height:1.2;text-align:center;min-height:80px}
.pi:hover{border-color:var(--co)}
.stage{position:relative;flex:1;overflow:hidden;background:var(--plate);background-image:radial-gradient(var(--plated) 1.2px,transparent 1.3px);background-size:20px 20px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.schv,.stage:has(#cv.schv){background-color:light-dark(#fbfbf8,#12171d)}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 80px)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[data-c=pe],.sw[data-wc=pe]{background:repeating-linear-gradient(45deg,#3aa845 0 6px,#f0d000 6px 12px)}
.sw.on{box-shadow:0 0 0 3px var(--live)}.sw.big{width:40px;height:40px}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.status{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.status>*{pointer-events:auto;max-width:640px}
.hint{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--mut)}
.fault{background:#fff1ec;color:#9b2410;border:1px solid #f6b9a6;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.meter{display:flex;flex-direction:column;background:#1b2028;color:#c9ff5a;border-radius:12px;padding:10px 14px;border:3px solid #f2c200;font-variant-numeric:tabular-nums}
.meter b{font-size:24px}.meter span{color:#d9dee6;font-size:13px}
.sheet,.guide{position:absolute;right:64px;top:64px;width:300px;max-height:calc(100% - 150px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.18);z-index:3}
.guide{left:10px;right:auto;top:52px;width:320px}
.guide summary{cursor:pointer;font-size:15px;list-style-position:inside}.guide details:not([open]) summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.guide ol{margin:4px 0 0;padding-left:20px;font-size:14px}.guide li{margin:4px 0}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sh-h b{font-size:15px;line-height:1.25}.sh-h span{color:var(--co);font-weight:700;font-size:14px}
.x{margin-left:auto;width:36px;height:36px;border-radius:8px;border:0;background:var(--soft);cursor:pointer;flex:none}
.form{display:flex;flex-direction:column;gap:8px}.form label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.chk{flex-direction:row!important;align-items:center;gap:10px!important;font-size:15px!important;color:var(--ink)!important}.chk input{width:22px;height:22px;min-height:0!important}
.form input,.form select{min-height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px;color:var(--ink)}
.info{font-size:14px;margin-top:10px;padding:10px;border-radius:8px;background:var(--soft)}
.sm-only{display:none}
/* ===== SVG linh kiện ===== */
svg text{font-family:"Be Vietnam Pro",system-ui,sans-serif}
.b-light{fill:#f4f5f2;stroke:#9aa3ad;stroke-width:1.3}.b-dark{fill:#2b3038;stroke:#151a20}.b-darker{fill:#1d2127}.b-shade{fill:#dfe2e0;stroke:#b8bec4}
.b-base{fill:#3a4049;stroke:#1d2228}.b-metal{fill:#c6ccd2;stroke:#8d959e}.b-face{fill:#e9ecef;stroke:#a7afb7}.b-yellow{fill:#f3c623;stroke:#b48c00}
.b-screen{fill:#1a2a1f;stroke:#0c140f}.lcd{fill:#9dff6a;font-size:11px;font-weight:700}
.pl{fill:#2a313a;font-size:11px;font-weight:600}.pl-w{fill:#fff;font-size:10px;font-weight:700}.pl-s{fill:#5d6672;font-size:10px;font-weight:600}
.pl-o{fill:var(--live);font-size:11px;font-weight:800}.pl-r{fill:#e5352b;font-size:11px;font-weight:800}.pl-g{fill:#1c9e4a;font-size:11px;font-weight:800}
.tag{fill:var(--co);font-size:13px;font-weight:800}
.fins rect{fill:#a9b1ba}
.led-on{fill:#3cff6e;filter:drop-shadow(0 0 4px #3cff6e)}.led-off{fill:#3a4a3f}.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.b-slot{fill:#161a1f}.h-on{fill:#e9ecef}.h-off{fill:#9aa2ab}.h-trip{fill:#ff8a3d}
.btn-test{fill:#f3c623}.btn-red{fill:#d8341f}.btn-blue{fill:#2166e0}
.plg-off{fill:#9aa2ab}.plg-on{fill:var(--live)}
.burnt circle{fill:rgba(20,20,20,.75)}.burnt path{stroke:#ff6a14;stroke-width:4;stroke-linecap:round}
.b-clear{fill:rgba(210,225,240,.35);stroke:#9fb2c4}.coilbox{fill:#b87333;stroke:#7a4a1f}.coilbox.on{fill:#ff8a3d}
.dialtrack{fill:none;stroke:#c0c7ce;stroke-width:5;stroke-linecap:round}.needle{stroke:#d8341f;stroke-width:3;stroke-linecap:round}
.b-bezel{fill:#c3c9cf;stroke:#7f8892}.btnface{stroke:rgba(0,0,0,.35);stroke-width:1.5}.knob{fill:#2b3038}.lever{stroke:#2b3038;stroke-width:5;stroke-linecap:round}
.glow{opacity:.45;filter:blur(5px)}.lens{opacity:.45;stroke:rgba(0,0,0,.3)}.lens.on{opacity:1}
.wave{fill:none;stroke:#8b939c;stroke-width:1.5}.wave.on{stroke:var(--live);animation:bl .4s steps(2) infinite}
.b-motor{fill:#3c6fb6;stroke:#24497e}.mfin{fill:#2f5c9c}.rotor{fill:#24497e;stroke:#162f55}.rotor.on{fill:#2b5799}.blade{fill:#d8e3f2}
.b-tbox{fill:#2f5c9c;stroke:#1d3d6c}.b-tb{fill:#9aa2ab;stroke:#6d757e}.screw{fill:#d7dce1;stroke:#6d757e}
.b-plate{fill:#fbfbf8;stroke:#b9bfc5;stroke-width:1.4}.rocker{fill:#e9ecef;stroke:#aab2ba}.rocker-hi{fill:#fff;stroke:#c4cad0}
.hole{fill:#30353c}.plug{fill:#59616c}.plug.on{fill:#1c9e4a}
.halo{fill:#ffd65a;opacity:.35;filter:blur(8px)}.bulb{fill:rgba(225,232,240,.7);stroke:#8d959e;stroke-width:1.5}.bulb.on{fill:#fff1a8;stroke:#e0b400}
.filament{fill:none;stroke:#7d858e;stroke-width:1.5}.filament.on{stroke:#ff8a00}.thin{stroke-width:1}
.fanb{fill:#c6ccd2;stroke:#8d959e}.fanb.on{fill:#9fc4ff}
.bell{fill:#c6ccd2;stroke:#8d959e}.bell.on{fill:#ffd65a;animation:bl .3s steps(2) infinite}.btn-door{fill:#f3c623;stroke:#b48c00}
.sl{stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}.sl.fillk{fill:var(--ink)}.nofill{fill:none}.dash{stroke-dasharray:4 4}
.live-s{stroke:var(--live)!important;stroke-width:2.6}.fill-live{fill:rgba(255,106,20,.28)}
.sym{fill:var(--ink);font-size:22px;font-weight:700}
.rail{stroke:var(--ink);stroke-width:3.5}
.schv .pl,.schv .pl-s{fill:var(--mut)}
/* dây & cực */
.whit{stroke:transparent;stroke-width:16;fill:none}.wcase{stroke:var(--wcase);stroke-width:7;fill:none;stroke-linecap:round}
.wcore{stroke-width:4.4;fill:none;stroke-linecap:round}.wcore.thin{stroke-width:2}
.wsw{display:inline-block;flex:none;width:34px;height:12px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--c) 0 6px,var(--s) 6px 12px,var(--c) 12px 18px,var(--s2) 18px 24px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.18)}
.wsw.big{width:56px;height:16px;border-radius:8px}
.wpick{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;max-width:300px}
.wpick span{display:flex;flex-direction:column;line-height:1.2}.wpick b{font-size:14px}.wpick small{color:var(--mut);font-size:12px}
.wsheet{position:absolute;inset:0;z-index:6;background:rgba(10,14,20,.35);display:flex;justify-content:center;align-items:flex-end}
.wbox{background:var(--card);width:min(560px,100%);max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px 24px;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.wbox h4{margin:14px 0 6px;font-size:13px;color:var(--co)}
.wlist{display:flex;flex-direction:column;gap:6px}
.witem{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px}
.witem.on{border-color:var(--live);box-shadow:0 0 0 2px rgba(255,106,20,.25)}
.witem>button:first-child{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;text-align:left;cursor:pointer;min-height:52px}
.witem span{display:flex;flex-direction:column;line-height:1.3}.witem b{font-size:15px}.witem small{color:var(--mut);font-size:13px}

.vtbl select,.vtbl input{font:inherit;font-size:15px;padding:8px 8px;min-height:40px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);max-width:260px}
.vnum{display:flex;align-items:center;gap:4px}.vnum input{width:100px}.vnum i{font-style:normal;color:var(--mut);font-size:12px}
.vin{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin:0 2px;font-size:12px}.vin.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.lcd.err{fill:#ff6d5e}
.mcup{display:flex;flex-direction:column;gap:8px}.mcucode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5;width:100%;min-height:300px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0f1720;color:#e6edf3;tab-size:2;white-space:pre;resize:vertical}
.mcuser{background:#0f1720;color:#9fe6b0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:120px;max-height:240px;overflow:auto;border-radius:10px;padding:10px;margin:0;white-space:pre-wrap}
.mcuh{display:flex;justify-content:space-between;align-items:baseline}.mcupins{display:flex;flex-wrap:wrap;gap:4px}.mcupins span{font:600 12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:5px;padding:2px 5px;color:var(--mut)}
.mcupins span.o{border-color:var(--co)}.mcupins span.on{background:var(--ok);color:#fff;border-color:var(--ok)}.mcuhelp{font-size:13px;line-height:1.6;color:var(--mut)}
.lcdtxt{font:700 17px ui-monospace,Menlo,Consolas,monospace;fill:#0b2530;letter-spacing:1.2px}
.rb-box{fill:#c98a3e;stroke:#7a4d17;stroke-width:1.5}
@media (max-width:760px){.vfdtop{grid-template-columns:1fr}.vscr b{font-size:40px}.vk{min-height:54px;font-size:16px}}
/* ===== cẩm nang PLC ===== */
.gchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.gchip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;min-height:42px}
.gchip:hover{border-color:var(--co)}.gchip.on{background:var(--co);border-color:var(--co);color:#fff}
.gwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
.gtoc{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.gtoc button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:9px 10px;border-radius:10px;cursor:pointer}
.gtoc button:hover{background:var(--soft)}.gtoc span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--co)}
.gbody{max-width:860px;min-width:0}
.gsec{padding:6px 0 34px;border-bottom:1px solid var(--line);margin-bottom:30px;scroll-margin-top:80px}.gsec:last-child{border:0}
.gsec h2{font-size:24px}.gsec h4{font-size:16px;margin:20px 0 8px}.gsec p{line-height:1.65}
.gread{padding-left:22px;line-height:1.65}.gread li{margin:5px 0}
.gsteps{counter-reset:s;list-style:none;padding:0}.gsteps li{counter-increment:s;position:relative;padding:10px 0 10px 46px;line-height:1.6;border-bottom:1px dashed var(--line)}
.gsteps li::before{content:counter(s);position:absolute;left:0;top:10px;width:32px;height:32px;border-radius:50%;background:var(--co);color:#fff;display:grid;place-items:center;font-weight:700}
.gtbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:15px;background:var(--card);border-radius:10px;overflow:hidden}
.gtbl th,.gtbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.5}
.gtbl thead th{background:var(--soft);font-weight:700}.gtbl tbody th{font-weight:600;background:var(--soft);width:30%}
.gtbl code,.gsec code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--co);font-size:14px}
.gtbl.cmp{font-size:13px;min-width:900px}.gtbl.cmp .on{background:color-mix(in srgb,var(--live) 12%,transparent)}.gtbl.cmp th.on{background:var(--live);color:#fff}
.gscroll{overflow-x:auto}
.gtip{background:color-mix(in srgb,var(--co) 9%,transparent);border-left:4px solid var(--co);padding:10px 14px;border-radius:8px;line-height:1.6}.gtip.warn{background:color-mix(in srgb,var(--live) 11%,transparent);border-color:var(--live)}
.gcard{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card);margin-top:14px;border-top:5px solid var(--co)}.gcard p{margin:6px 0}
.gfig{width:100%;max-width:660px;height:auto;display:block;margin:8px 0 14px;color:var(--mut)}
.gbx{fill:var(--card);stroke:var(--co);stroke-width:2}.gbt{font-weight:700;font-size:16px;text-anchor:middle;fill:var(--co)}.gbs{font-size:13px;text-anchor:middle;fill:var(--mut)}
.gar{fill:none;stroke:currentColor;stroke-width:2}
.gwire{margin:10px 0;background:var(--plate);border-radius:14px;padding:8px;border:1px solid var(--line)}.gwire svg{width:100%;height:auto;max-height:560px;display:block}.gwire figcaption{font-size:14px;color:var(--mut);padding:8px 6px 2px;line-height:1.5}
.gles{border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin:18px 0;background:var(--card);scroll-margin-top:80px}
.gles-h{display:flex;gap:14px;align-items:flex-start}.gles-h h3{margin:2px 0 4px;font-size:19px}.gles-h p{margin:0}
.gnum{flex:none;width:38px;height:38px;border-radius:12px;background:var(--co);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.ladder.gl{margin:10px 0}
.glink{display:inline-block;margin-top:10px;font-weight:600;color:var(--co);text-decoration:none;padding:6px 0}
.gcode{margin:10px 0}.gcode summary{cursor:pointer;font-weight:600;color:var(--co);padding:6px 0}
.qz{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--card)}.qz p{margin:0 0 8px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}.qopt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);text-align:left;min-height:42px}
.qopt:hover{border-color:var(--co)}.qopt.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border-color:var(--ok);color:var(--ink);font-weight:600}.qopt.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);border-color:var(--bad);color:var(--ink)}
.qex{margin:10px 0 0!important;color:var(--mut);font-size:14px;line-height:1.55}
@media (max-width:900px){.gsec,.gles{scroll-margin-top:130px}.gwrap{grid-template-columns:1fr;gap:0}.gtoc{position:static;flex-direction:row;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}.gtoc button{flex:none;border:1px solid var(--line);font-size:14px}.gles{padding:14px}.gtbl{font-size:14px}.gtbl tbody th{width:38%}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="#home"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="2" width="26" height="26" rx="7" fill="#ff6a14"/><path d="M17 5l-7 12h5l-2 8 7-12h-5z" fill="#fff"/></svg>Xưởng Đấu Dây</a>
<nav class="nav" aria-label="Chính"><a href="#home">Xưởng</a><a href="#mau">Bài mẫu</a><a href="#linhkien">Cẩm nang linh kiện</a><a href="#kyhieu">Ký hiệu điện</a><a href="#plc">Cẩm nang PLC</a><a href="#bientan">Cẩm nang biến tần</a><a href="#duan">Dự án</a></nav></header>
<main id="main"></main>
<footer>Xưởng Đấu Dây · công cụ học tập mô phỏng. Khi thi công thật, luôn cắt điện, đo kiểm và tuân thủ quy chuẩn an toàn điện.</footer>
<section class="ed" id="ed" hidden>
 <div class="edbar">
  <button class="tb" id="backbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l-6 6 6 6M4 12h11M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/></svg><span>Quay lại</span></button>
  <button class="tb" id="wirebtn"><span class="wsw big" id="wirecur"></span><span>Dây dẫn ▾</span></button>
  <button class="tb" id="palbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10M18 15v6M15 18h6"/></svg><span>Linh kiện ▾</span></button>
  <button class="tb" id="savebtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg><span>Lưu</span></button>
  <button class="runb" id="runbtn">▶ Chạy</button>
 </div>
 <div class="stage" id="stage">
  <svg id="cv"><g id="world"><g id="lw"></g><g id="lp"></g><g id="lt"></g><g id="lf" class="fxl"></g></g></svg>
  <div class="badge" id="badge"></div>
  <div class="status" id="status"></div>
  <div class="tools" id="tools">
   <button id="tcol" aria-label="Thu gọn công cụ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
   <div class="tgrp" id="tgrp">
    <button id="undobtn" aria-label="Hoàn tác"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg></button>
    <button id="redobtn" aria-label="Làm lại"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 0 0 0 12"/></svg></button>
    <button id="clearbtn" aria-label="Xoá hết"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    <hr>
    <button id="zout" aria-label="Thu nhỏ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16 16l5 5M8 11h6"/></svg></button>
    <button id="zin" aria-label="Phóng to"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16 16l5 5M8 11h6M11 8v6"/></svg></button>
    <button id="fitbtn" aria-label="Vừa màn hình"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M9 9h6v6H9z"/></svg></button>
    <hr>
    <button id="meterbtn" aria-label="Đồng hồ đo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 6h8v5H8zM12 15v3M9 15h.01M15 15h.01"/></svg></button>
    <button id="lockbtn" aria-label="Khoá bố trí"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5zM12 15v2"/></svg></button>
    <button id="guidebtn" aria-label="Hướng dẫn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7v.5M12 17h.01"/></svg></button>
    <button id="setbtn" aria-label="Cài đặt dự án"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-1-3-2 .3-1.3-1.3L17 5l-3-1-1 2h-2l-1-2-3 1 .3 2L6 8.3 4 8l-1 3 2 1v1l-2 1 1 3 2-.3L7.3 17 7 19l3 1 1-2h2l1 2 3-1-.3-2 1.3-1.3 2 .3 1-3-2-1z"/></svg></button>
   </div>
  </div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="guide" id="guide" hidden></div>

 </div>

<script>
/* ===== Xưởng Đấu Dây — lõi mô phỏng + định nghĩa linh kiện ===== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = {};
function def(type, o) { P[type] = Object.assign({ type, props: [], cats: [] }, o); }
function termsOf(p) { const d = P[p.type]; return typeof d.terms === 'function' ? d.terms(p) : d.terms; }
function T(S, tag) { return S[tag] || (S[tag] = { coil: false, since: 0, pressed: false, act: false, on: true, tripped: false, delay: 5, psu: false }); }

/* ---------- vẽ dùng chung ---------- */
const box = (w, h, cls = 'b-light', r = 6, x = 0, y = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${cls}"/>`;
const txt = (x, y, s, cls = 'pl', anchor = 'middle') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const LAMPC = { green: '#22b24c', red: '#e5352b', yellow: '#f4c21b', white: '#f3f1e8', blue: '#2f7de1', orange: '#ff7a1a' };
const VOPT = [{ v: '230AC', l: '230 V AC' }, { v: '24DC', l: '24 V DC' }];
const COLOPT = [{ v: 'green', l: 'Xanh lá' }, { v: 'red', l: 'Đỏ' }, { v: 'yellow', l: 'Vàng' }, { v: 'white', l: 'Trắng' }, { v: 'blue', l: 'Xanh dương' }];

/* tiếp điểm IEC (dọc), x tâm = cx, từ y0 tới y1 */
function sContact(cx, y0, y1, kind, closed, opt = {}) {
  const m = (y0 + y1) / 2, a = m - 12, b = m + 12;
  let s = `<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${a}" class="sl"/><line x1="${cx}" y1="${b}" x2="${cx}" y2="${y1}" class="sl"/>`;
  const cl = closed ? 'sl live-s' : 'sl';
  if (kind === 'no') {
    s += closed ? `<line x1="${cx}" y1="${b}" x2="${cx - 2}" y2="${a}" class="${cl}"/>` : `<line x1="${cx}" y1="${b}" x2="${cx - 13}" y2="${a + 3}" class="${cl}"/>`;
  } else {
    s += `<line x1="${cx}" y1="${a}" x2="${cx + 9}" y2="${a}" class="sl"/>`;
    s += closed ? `<line x1="${cx}" y1="${b}" x2="${cx + 9}" y2="${a - 1}" class="${cl}"/>` : `<line x1="${cx}" y1="${b}" x2="${cx - 13}" y2="${a + 3}" class="${cl}"/>`;
  }
  if (opt.brk) s += `<path d="M${cx - 4} ${a - 4}l8 8m0-8l-8 8" class="sl"/>`;
  const ax = cx - 7, ay = m;
  if (opt.push) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 26}" y2="${ay}" class="sl dash"/><path d="M${cx - 26} ${ay - 6}v12M${cx - 26} ${ay - 6}h-4M${cx - 26} ${ay + 6}h-4" class="sl"/>`;
  if (opt.estop) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 24}" y2="${ay}" class="sl dash"/><path d="M${cx - 24} ${ay - 7}a7 7 0 0 0 0 14z" class="sl fillk"/>`;
  if (opt.sel) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 26}" y2="${ay}" class="sl dash"/><path d="M${cx - 26} ${ay - 6}l-5 6 5 6" class="sl"/>`;
  if (opt.lim) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 24}" y2="${ay}" class="sl dash"/><path d="M${cx - 24} ${ay - 6}l-6 6 6 6z" class="sl"/>`;
  if (opt.ol) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 22}" y2="${ay}" class="sl dash"/><rect x="${cx - 34}" y="${ay - 6}" width="12" height="12" class="sl nofill"/><path d="M${cx - 32} ${ay + 3}l3-6 3 6 3-6" class="sl nofill"/>`;
  if (opt.ton) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 22}" y2="${ay}" class="sl dash"/><path d="M${cx - 30} ${ay - 8}a8 8 0 0 0 0 16" class="sl nofill"/><line x1="${cx - 30}" y1="${ay - 8}" x2="${cx - 30}" y2="${ay + 8}" class="sl"/>`;
  if (opt.toff) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 22}" y2="${ay}" class="sl dash"/><path d="M${cx - 22} ${ay - 8}a8 8 0 0 1 0 16" class="sl nofill"/><line x1="${cx - 22}" y1="${ay - 8}" x2="${cx - 22}" y2="${ay + 8}" class="sl"/>`;
  if (opt.flt) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 22}" y2="${ay}" class="sl dash"/><circle cx="${cx - 28}" cy="${ay}" r="6" class="sl nofill"/>`;
  if (opt.prox) s += `<line x1="${ax}" y1="${ay}" x2="${cx - 20}" y2="${ay}" class="sl dash"/><path d="M${cx - 28} ${ay - 8}l8 8-8 8-8-8z" class="sl nofill"/>`;
  return s;
}
const tagLbl = (p, x = 44, y = 44, anchor = 'start') => txt(x, y, p.tag || '', 'tag', anchor);

/* ===================== NGUỒN ===================== */
def('nguon3', {
  name: 'Nguồn 3 pha 380/220 V', short: 'Nguồn 3 pha', cats: ['ind'], w: 230, h: 70, prefix: 'X',
  terms: [['L1', 25, 70, 'b'], ['L2', 70, 70, 'b'], ['L3', 115, 70, 'b'], ['N', 160, 70, 'b'], ['PE', 205, 70, 'b']],
  el: () => [{ k: 'src', t: 'L1', pot: 'L1' }, { k: 'src', t: 'L2', pot: 'L2' }, { k: 'src', t: 'L3', pot: 'L3' }, { k: 'src', t: 'N', pot: 'N' }, { k: 'src', t: 'PE', pot: 'N', pe: 1 }],
  draw: (p, v) => box(230, 70, 'b-dark', 8) + `<rect x="10" y="10" width="54" height="22" rx="4" class="b-screen"/>` + txt(37, 26, v.powered ? '380 V' : '— — —', 'lcd') +
    txt(150, 27, 'NGUỒN 3 PHA', 'pl-w') + [['#8b5a2b', 25], ['#222', 70], ['#8a8f96', 115], ['#1f6fe0', 160], ['#3aa845', 205]].map(([c, x]) => `<rect x="${x - 14}" y="40" width="28" height="8" rx="2" fill="${c}"/>`).join(''),
  info: 'Nguồn cấp 3 pha 4 dây + dây bảo vệ PE. Điện áp dây (pha–pha) 380–400 V, điện áp pha (pha–trung tính) 220–230 V. Quy ước màu dây: L1 nâu, L2 đen, L3 xám, N xanh dương, PE vàng-xanh lá.'
});
def('nguon1', {
  name: 'Nguồn 1 pha 220 V', short: 'Nguồn 1 pha', cats: ['ind', 'dom'], w: 150, h: 70, prefix: 'X',
  terms: [['L', 30, 70, 'b'], ['N', 75, 70, 'b'], ['PE', 120, 70, 'b']],
  el: () => [{ k: 'src', t: 'L', pot: 'L1' }, { k: 'src', t: 'N', pot: 'N' }, { k: 'src', t: 'PE', pot: 'N', pe: 1 }],
  draw: (p, v) => box(150, 70, 'b-dark', 8) + `<rect x="10" y="10" width="54" height="22" rx="4" class="b-screen"/>` + txt(37, 26, v.powered ? '220 V' : '— — —', 'lcd') + txt(108, 27, '1 PHA', 'pl-w') +
    [['#8b5a2b', 30], ['#1f6fe0', 75], ['#3aa845', 120]].map(([c, x]) => `<rect x="${x - 14}" y="40" width="28" height="8" rx="2" fill="${c}"/>`).join(''),
  info: 'Nguồn 1 pha dân dụng: dây pha L (nâu/đỏ), dây trung tính N (xanh dương), dây tiếp địa PE (vàng-xanh). Điện áp L–N khoảng 220–230 V.'
});
def('psu', {
  name: 'Bộ nguồn 24 V DC', short: 'Nguồn 24VDC', cats: ['ind'], w: 120, h: 110, prefix: 'G',
  terms: [['L', 30, 0, 't'], ['N', 60, 0, 't'], ['PE', 90, 0, 't'], ['P', 40, 110, 'b', '+V'], ['M', 80, 110, 'b', '0V']],
  el: (p, S) => { const st = T(S, p.tag); const e = [{ k: 'pwr', a: 'L', b: 'N', tag: p.tag, v: '230AC', w: 6 }]; if (st.psu) e.push({ k: 'src', t: 'P', pot: 'D+' }, { k: 'src', t: 'M', pot: 'D0' }); return e; },
  draw: (p, v) => box(120, 110, 'b-metal', 4) + `<g class="fins">${[0, 1, 2, 3, 4, 5].map(i => `<rect x="${14 + i * 16}" y="22" width="8" height="40" rx="2"/>`).join('')}</g>` +
    txt(60, 80, '24 V DC', 'pl') + `<circle cx="100" cy="92" r="5" class="${v.psu ? 'led-on' : 'led-off'}"/>` + tagLbl(p, 8, 98),
  info: 'Bộ nguồn xung đổi 220 V AC sang 24 V DC cho mạch điều khiển an toàn (PLC, cảm biến, rơ le 24 V). Đầu vào L, N, PE; đầu ra +V và 0V. Chỉ có điện ra khi đầu vào được cấp 220 V.'

/* ---------- AST tiện ích ---------- */
let NID = 1;

/* ---------- ngôn ngữ 1: biểu thức logic ---------- */
function compileExpr(text, M) {
  const out = { stmts: [], err: null };

    const line = raw.replace(/(\/\/|;|#(?!\d)).*$/, '').trim(); if (!line) return;

    while (pos < line.length) { re.lastIndex = pos; const m = re.exec(line); if (!m) { out.err = out.err || `Dòng ${li + 1}: không hiểu "${line.slice(pos).trim().slice(0, 12)}"`; return; } toks.push(m[1].toUpperCase()); pos = re.lastIndex; while (line[pos] === ' ') pos++; }
    let i = 0; const peek = () => toks[i], eat = t => { if (toks[i] !== t) throw `cần "${t}"`; i++; };

    const term = () => { const a = [fac()]; while (['*', 'AND', '&', '·'].includes(peek())) { i++; a.push(fac()); } return AND(a); };

}

/* ---------- ngôn ngữ 2: danh sách lệnh (IL / STL / Mnemonic) ---------- */

          else if (/^C/.test(c) && w[2]) { const nd = N({ t: 'call', f: 'CTU', args: [cur, { t: 'num', v: val(w[2]) }] }); cnts.push([c, nd]); out.stmts.push({ tgt: c, e: nd, line: li + 1 }); }

          out.stmts.push({ tgt: c, e: N({ t: 'call', f: off ? 'TOF' : 'TON', args: [cur, { t: 'num', v: val(w[2]) / 10 }] }), line: li + 1 }); fresh = true; break; }

      }
    } catch (er) { out.err = `Dòng ${li + 1}: ${er}`; }
  });

/* ---------- ngôn ngữ 3: ST / SCL ---------- */

/* ===== Bài mẫu ===== */
function mk(mode) {
  const pr = { mode, parts: [], wires: [], n: 1 };
  const cnt = {};
  pr.add = (type, x, y, o = {}) => {
    const d = P[type]; const id = 'p' + (pr.n++);
    const p = Object.assign({ id, type, x, y }, o);
    if (!p.tag && !d.noTag) { cnt[d.prefix] = (cnt[d.prefix] || 0) + 1; p.tag = d.prefix + cnt[d.prefix]; }
    for (const pp of d.props) if (p[pp.k] === undefined) p[pp.k] = pp.d;
    pr.parts.push(p); return id;
  };
  pr.w = (a, ta, b, tb, c) => { pr.wires.push({ id: 'w' + (pr.n++), a: a + ':' + ta, b: b + ':' + tb, c: c || (mode === 'sch' ? 'ink' : 'red') }); };
  return pr;
}
const C = { L1: 'brown', L2: 'black', L3: 'grey', N: 'blue', PE: 'pe', K: 'red' };
function fin(pr, meta) { delete pr.add; delete pr.w; return Object.assign(pr, meta); }

/* bàn thực hành biến tần: nguồn, MCCB, biến tần, động cơ, đèn lỗi + tùy chọn điều khiển */
function vfdBench(o) {
  const t = mk('ind');
  const src = t.add('nguon3', 40, 20), q1 = t.add('cb3', 80, 140, { tag: 'Q1' }), u = t.add('bt', 40, 340, { tag: 'U1', vm: o.vm || 'generic', kw: o.kw || 4, vp: Object.assign({}, o.vp || {}) });
  const m = t.add('dc3', 330, 710, { tag: 'M1', kw: o.mkw || 3 }), h = t.add('den', 470, 220, { tag: 'H1', color: 'red' });
  t.w(src, 'L1', q1, '1', C.L1); t.w(src, 'L2', q1, '3', C.L2); t.w(src, 'L3', q1, '5', C.L3);
  t.w(q1, '2', u, 'R', C.L1); t.w(q1, '4', u, 'S', C.L2); t.w(q1, '6', u, 'T', C.L3);
  t.w(u, 'U', m, 'U', C.L1); t.w(u, 'V', m, 'V', C.L2); t.w(u, 'W', m, 'W', C.L3); t.w(src, 'PE', m, 'PE', C.PE);
  t.w(q1, '2', u, 'C', 'red'); t.w(u, 'A', h, 'X1', 'red'); t.w(h, 'X2', src, 'N', C.N);
  let x = 10;
  if (o.run === 'sel3') { const es = t.add('dung', x, 700, { tag: 'S0' }); x += 95; const sa = t.add('cx3', x, 700, { tag: 'SA1' }); x += 105;
    t.w(u, 'COM', es, '11', 'violet'); t.w(es, '12', sa, '13', 'violet'); t.w(es, '12', sa, '23', 'violet'); t.w(sa, '14', u, 'FWD', 'violet'); t.w(sa, '24', u, 'REV', 'violet'); }
  if (o.run === 'sw') { const s1 = t.add('cx', x, 700, { tag: 'S1' }); x += 85; t.w(u, 'COM', s1, '13', 'violet'); t.w(s1, '14', u, 'FWD', 'violet'); }
  if (o.ms) ['X1', 'X2'].forEach((k, i) => { const s = t.add('cx', x, 700, { tag: 'S' + (i + 2) }); x += 85; t.w(u, 'COM', s, '13', 'violet'); t.w(s, '14', u, k, 'violet'); });
  if (o.pot) { const rv = t.add('bientro', x, 700, { tag: 'RV1', val: 50 }); x += 95; t.w(u, 'V10', rv, '1', 'white'); t.w(rv, '2', u, 'AI', 'white'); t.w(rv, '3', u, 'GND', 'white'); }
  return t;
}

  () => { // Robot gắp thả bằng PLC
    const t = mk('ind');
    const no = a => ({ k: 'no', a }), nc = a => ({ k: 'nc', a }), par = (...b) => ({ k: 'par', b: b.map(x => Array.isArray(x) ? x : [x]) }), R = (s, o) => ({ s, o });
    const set = a => ({ k: 'set', a }), rst = a => ({ k: 'rst', a }), coil = a => ({ k: 'coil', a });
    const lad = { rungs: [
      R([par(no('I0.0'), no('M0')), no('I0.1'), no('I0.7')], coil('M0')),
      R([par(no('M1'), no('M2'), no('M3'), no('M4'), no('M5'), no('M6'), no('M7'), no('M8'))], coil('M9')),
      R([no('M0'), no('I0.6'), no('I0.2'), no('I0.4'), nc('M9')], set('M1')),
      R([no('M1'), no('I0.5')], set('M2')), R([no('M2')], rst('M1')),
      R([no('M2')], { k: 'ton', a: 'T0', t: 0.5 }), R([no('M2'), no('T0')], set('M3')), R([no('M3')], rst('M2')),
      R([no('M3'), no('I0.4')], set('M4')), R([no('M4')], rst('M3')),
      R([no('M4'), no('I0.3')], set('M5')), R([no('M5')], rst('M4')),
      R([no('M5'), no('I0.5')], set('M6')), R([no('M6')], rst('M5')),
      R([no('M6')], { k: 'ton', a: 'T1', t: 0.5 }), R([no('M6'), no('T1')], set('M7')), R([no('M7')], rst('M6')),
      R([no('M7'), no('I0.4')], set('M8')), R([no('M8')], rst('M7')),
      R([no('M8'), no('I0.2')], rst('M8')),
      ...[1, 2, 3, 4, 5, 6, 7, 8].map(k => R([nc('I0.7')], rst('M' + k))),
      R([par(no('M4'), no('M5'), no('M6'), no('M7'))], coil('Q0.0')),
      R([par(no('M1'), no('M2'), no('M5'), no('M6'))], coil('Q0.1')),
      R([par(no('M2'), no('M3'), no('M4'), no('M5'))], coil('Q0.2')),
      R([no('M0')], coil('Q0.3')),

    const src = t.add('nguon1', 40, 20), q1 = t.add('mcb1', 250, 10, { tag: 'Q1' });

    const rb = t.add('robot', 700, 340, { tag: 'RB1' });
    t.w(src, 'L', q1, '1', C.L1); t.w(q1, '2', plc, 'L', 'red'); t.w(src, 'N', plc, 'N', C.N); t.w(src, 'PE', plc, 'PE', C.PE);
    t.w(plc, 'M', plc, '1M', 'bluewhite');
    t.w(plc, 'L+', s1, '13', 'darkblue'); t.w(s1, '14', plc, 'I0.0', 'violet'); t.w(plc, 'L+', s2, '21', 'darkblue'); t.w(s2, '22', plc, 'I0.1', 'violet');
    t.w(plc, 'L+', rb, '+24V', 'darkblue'); t.w(plc, 'M', rb, '0V', 'bluewhite');
    [['a0', 'I0.2'], ['a1', 'I0.3'], ['b0', 'I0.4'], ['b1', 'I0.5'], ['P', 'I0.6']].forEach(([a, b]) => t.w(rb, a, plc, b, 'violet'));

    return fin(t, { key: 'plc-robot', name: 'Robot gắp thả 2 trục khí nén điều khiển bằng PLC', cat: 'Công nghiệp', lvl: 'Nâng cao',
      desc: 'PLC S7-1200 điều khiển robot gắp thả: 3 van khí nén 5/2 một đầu điện 24 V (Y1 trục X, Y2 trục Z, Y3 kẹp) nối ngõ ra Q0.0–Q0.2, 5 cảm biến vị trí a0, a1, b0, b1 và cảm biến có phôi P nối ngõ vào I0.2–I0.6. Chương trình LAD chạy tuần tự 8 bước bằng bit nhớ M1–M8 (SET bước sau, RESET bước trước). Nút dừng khẩn S0 cắt nguồn 24 V cấp cho các van bằng phần cứng, đồng thời báo về I0.7 để PLC xóa hết các bước.',
      steps: ['Bấm ▶ Chạy. Robot ở vị trí gốc: đèn a0 (X đã về) và b0 (Z ở trên) sáng, có phôi ở trạm lấy (P sáng).', 'Nhấn S1 (Start): M0 tự giữ, đèn H1 sáng. Robot chạy 8 bước: hạ Z → kẹp 0,5 s → nâng Z → X sang phải → hạ Z → nhả 0,5 s → nâng Z → X về. Còn phôi thì lặp lại.', 'Chạm PLC1 để xem sơ đồ thang chạy trực tiếp: bước nào đang chạy thì bit M đó sáng.', 'Nhấn S2 (Stop, đấu tiếp điểm thường đóng 21-22): robot làm hết chu trình đang dở rồi dừng ở gốc.', 'Chạm robot RB1 để tắt cấp phôi: hết phôi thì robot đứng chờ, đèn H2 nháy.', 'Đang chạy, ấn dừng khẩn S0: mất 24 V ở 1L, cả 3 van mất điện, xi lanh về vị trí lò xo (X về, Z nâng, kẹp mở) nên phôi đang kẹp sẽ rơi. Đây là lý do van kẹp thực tế hay dùng van 2 đầu điện có nhớ. I0.7 mất tín hiệu nên PLC xóa hết các bước: nhả dừng khẩn robot đứng yên, phải nhấn Start lại.'] });

    fx: { hang: 'Mitsubishi', sw: 'GX Works2 (FX3U) · GX Works3 dùng cho dòng FX5U', code: 'FX3U-16MR: 16 điểm I/O (8 vào / 8 ra), M = khối CPU chính, R = ngõ ra Relay (T là Transistor).', io: '8 vào / 8 ra', tim: 'T0–T199 đơn vị 100 ms: OUT T0 K50 = 5 s', cnt: 'OUT C0 K5, muốn về 0 phải dùng RST C0', aiR: 'Cần module analog (FX3U-4AD…); trong app đọc sẵn vào D0, D1 (0–4000)', note: 'X và Y đánh số hệ bát phân: X0–X7 rồi X10–X17, KHÔNG có X8, X9. Không có lệnh trễ ngắt TOF.' },
    dvp: { hang: 'Delta', sw: 'ISPSoft hoặc WPLSoft', code: 'DVP-14SS2: 14 điểm I/O (8 vào / 6 ra), dòng SS2. Mã đầy đủ đuôi R là ngõ ra Relay, đuôi T là Transistor.', io: '8 vào / 6 ra', tim: 'TMR T0 K50: đơn vị 100 ms = 5 s', cnt: 'CNT C0 K5, xóa bằng RST C0', aiR: 'Cần module analog; trong app đọc sẵn vào D0, D1 (0–4000)', note: 'Giống Mitsubishi: X, Y đánh số bát phân (không có X8, X9). Không có lệnh trễ ngắt TOF.' },
    cp1e: { hang: 'Omron', sw: 'CX-Programmer (bộ CX-One)', code: 'CP1E-N20DR-A: N = loại có cổng truyền thông, 20 điểm I/O (12 vào / 8 ra), D = ngõ vào DC, R = ngõ ra Relay, A = nguồn nuôi AC.', io: '12 vào / 8 ra', tim: 'TIM 000 #50: đơn vị 100 ms = 5 s. Dấu # bắt buộc', cnt: 'CNT 000 #5: khối có 2 chân, chân trên đếm, chân dưới reset', aiR: 'Bản có analog (NA20) đọc ở kênh 90, 91; trong app 0–6000', note: 'Ghi TIM 000 50 (thiếu #) là sai: PLC hiểu 50 là địa chỉ kênh chứ không phải con số.' },
    xbc: { hang: 'LS (LS Electric)', sw: 'XG5000', code: 'XBC-DR14E: dòng XBC compact, D = ngõ vào DC, R = ngõ ra Relay, 14 điểm I/O (8 vào / 6 ra), E = dòng tiết kiệm.', io: '8 vào / 6 ra', tim: 'TON T0000 50: đơn vị 100 ms = 5 s; TOFF là trễ ngắt', cnt: 'CTU C0000 5, xóa bằng RST C0000', aiR: 'Cần module analog; trong app D0, D1 (0–16000)', note: 'Địa chỉ P gồm số kênh và số bit: P00040 là kênh P0004, bit 0.' }
  },
  // thiết bị bàn thực hành: i = ngõ vào, q = ngõ ra
  lessons: [
    { id: 'l1', t: 'Tiếp điểm thường mở, thường đóng và cuộn dây', goal: 'Hiểu 3 ký hiệu cơ bản nhất của sơ đồ thang.',
      io: [['I0.0', 'S1 – nút nhấn', 'Nút thử'], ['Q0.0', 'H1 – đèn xanh', 'Sáng khi nhấn S1'], ['Q0.1', 'H2 – đèn đỏ', 'Tắt khi nhấn S1']],
      lad: { rungs: [{ s: [{ k: 'no', a: 'I0.0' }], o: { k: 'coil', a: 'Q0.0' } }, { s: [{ k: 'nc', a: 'I0.0' }], o: { k: 'coil', a: 'Q0.1' } }] },
      read: ['Đọc sơ đồ từ trái sang phải giống dòng điện đi từ thanh nguồn bên trái sang thanh bên phải.', 'Tiếp điểm thường mở ┤├ "dẫn điện" khi ngõ vào {I0.0} đang có tín hiệu (đèn ngõ vào sáng).', 'Tiếp điểm thường đóng ┤/├ thì ngược lại: dẫn khi {I0.0} KHÔNG có tín hiệu.', 'Cuộn dây ( ) ở cuối mạch: mạch thông thì ngõ ra {Q0.0} ON, đèn nối ở ngõ ra sáng.'],
      tip: 'Tiếp điểm trong chương trình chỉ là phép "hỏi trạng thái" của một bit, không phải tiếp điểm thật. Một địa chỉ có thể dùng làm tiếp điểm bao nhiêu lần cũng được.',
      tr: { i: [{ n: 0, d: 'nn', tag: 'S1', color: 'green' }], q: [{ n: 0, color: 'green' }, { n: 1, color: 'red' }] },
      steps: ['Bấm ▶ Chạy. PLC có điện, đèn H2 sáng vì tiếp điểm thường đóng {I0.0} đang dẫn.', 'Nhấn giữ S1: đèn ngõ vào số 0 trên PLC sáng, H1 sáng, H2 tắt.', 'Thả S1: trở lại như cũ. Chạm PLC1 để xem sơ đồ thang đổi màu theo trạng thái.'] },
    { id: 'l2', t: 'Nối tiếp là VÀ, song song là HOẶC', goal: 'Ghép nhiều điều kiện trong một mạch.',
      io: [['I0.0', 'S1 – công tắc xoay', 'Điều kiện A'], ['I0.1', 'S2 – nút nhấn', 'Điều kiện B'], ['Q0.0', 'H1 – đèn', 'Sáng khi A VÀ B'], ['Q0.1', 'H2 – đèn', 'Sáng khi A HOẶC B']],
      lad: { rungs: [{ s: [{ k: 'no', a: 'I0.0' }, { k: 'no', a: 'I0.1' }], o: { k: 'coil', a: 'Q0.0' } }, { s: [{ k: 'par', b: [[{ k: 'no', a: 'I0.0' }], [{ k: 'no', a: 'I0.1' }]] }], o: { k: 'coil', a: 'Q0.1' } }] },
      read: ['Mạch 1: hai tiếp điểm nối tiếp, phải nhấn cả S1 và S2 thì {Q0.0} mới ON (ứng dụng: máy dập phải nhấn 2 tay).', 'Mạch 2: hai tiếp điểm song song, nhấn S1 hoặc S2 đều làm {Q0.1} ON (ứng dụng: bật máy từ 2 nơi).'],
      tip: 'Mọi mạch điều khiển dù phức tạp đều chỉ là ghép nối tiếp và song song. Nắm chắc bài này là đọc được hầu hết chương trình.',
      tr: { i: [{ n: 0, d: 'cx', tag: 'S1' }, { n: 1, d: 'nn', tag: 'S2', color: 'green' }], q: [{ n: 0, color: 'green' }, { n: 1, color: 'yellow' }] },
      steps: ['Bấm ▶ Chạy.', 'Nhấn S2: chỉ H2 sáng (HOẶC).', 'Chạm công tắc S1 để bật: H2 sáng.', 'Giữ S1 đang bật rồi nhấn S2: H1 sáng vì đủ cả hai điều kiện (VÀ).'] },
    { id: 'l3', t: 'Mạch tự giữ Start / Stop', goal: 'Bài quan trọng nhất: nhấn Start rồi thả, động cơ vẫn chạy; nhấn Stop mới dừng.',
      io: [['I0.0', 'S1 – nút Start (thường mở)', 'Chạy'], ['I0.1', 'S2 – nút Stop (đấu tiếp điểm thường mở)', 'Dừng'], ['Q0.0', 'H1 – đèn (thay cho cuộn contactor)', 'Động cơ chạy']],
      lad: { rungs: [{ s: [{ k: 'par', b: [[{ k: 'no', a: 'I0.0' }], [{ k: 'no', a: 'Q0.0' }]] }, { k: 'nc', a: 'I0.1' }], o: { k: 'coil', a: 'Q0.0' } }] },
      read: ['Nhấn Start: {I0.0} dẫn, {Q0.0} ON.', 'Tiếp điểm {Q0.0} mắc song song với Start cũng đóng lại, nên khi thả Start mạch vẫn thông. Đó là "tự giữ" (duy trì).', 'Nhấn Stop: tiếp điểm thường đóng {I0.1} hở ra, {Q0.0} OFF, tự giữ mất.'],
      tip: 'Trong bài này nút Stop đấu bằng tiếp điểm THƯỜNG MỞ nên chương trình dùng tiếp điểm thường đóng. Ngoài thực tế người ta thường đấu Stop bằng tiếp điểm thường đóng, xem bài tiếp theo.',
      tr: { i: [{ n: 0, d: 'nn', tag: 'S1', color: 'green' }, { n: 1, d: 'nn', tag: 'S2', color: 'red' }], q: [{ n: 0, color: 'green' }] },
      steps: ['Bấm ▶ Chạy.', 'Nhấn S1 (Start) rồi thả: H1 vẫn sáng nhờ tự giữ.', 'Nhấn S2 (Stop): H1 tắt.', 'Thử xóa nhánh tự giữ: dừng mô phỏng, chạm PLC1, chạm tiếp điểm {Q0.0} rồi bấm Xóa, chạy lại để thấy thả Start là đèn tắt.'] },
    { id: 'l4', t: 'Nút Stop thường đóng: chỗ người mới hay nhầm nhất', goal: 'Hiểu vì sao nút Stop ngoài thực tế là thường đóng (NC) nhưng trong chương trình lại vẽ tiếp điểm thường mở.',
      io: [['I0.0', 'S1 – nút Start, đấu 13-14 (thường mở)', 'Chạy'], ['I0.1', 'S2 – nút Stop, đấu 21-22 (THƯỜNG ĐÓNG)', 'Dừng'], ['Q0.0', 'H1 – đèn', 'Động cơ chạy']],
      lad: { rungs: [{ s: [{ k: 'par', b: [[{ k: 'no', a: 'I0.0' }], [{ k: 'no', a: 'Q0.0' }]] }, { k: 'no', a: 'I0.1' }], o: { k: 'coil', a: 'Q0.0' } }] },
      read: ['Nút Stop đấu tiếp điểm thường đóng nên lúc KHÔNG nhấn, dòng 24 V vẫn đi vào {I0.1}: đèn ngõ vào số 1 luôn sáng.', 'Vì {I0.1} bình thường là ON, chương trình dùng tiếp điểm THƯỜNG MỞ {I0.1} để mạch thông.', 'Nhấn Stop: tiếp điểm ngoài hở, {I0.1} mất tín hiệu, tiếp điểm thường mở trong chương trình hở, động cơ dừng.', 'Lợi ích an toàn: nếu dây nút Stop bị đứt, {I0.1} mất tín hiệu và máy tự dừng (không chạy được), thay vì bấm Stop mà máy không dừng.'],
      tip: 'Quy tắc nhớ: tiếp điểm trong chương trình "hỏi" trạng thái của NGÕ VÀO, không quan tâm nút ngoài là thường mở hay thường đóng. Muốn mạch thông khi ngõ vào đang sáng đèn thì vẽ thường mở.',
      tr: { i: [{ n: 0, d: 'nn', tag: 'S1', color: 'green' }, { n: 1, d: 'nn', tag: 'S2', color: 'red', nc: 1 }], q: [{ n: 0, color: 'green' }] },
      steps: ['Bấm ▶ Chạy: đèn ngõ vào số 1 trên PLC sáng sẵn dù chưa nhấn gì, vì S2 đấu tiếp điểm thường đóng 21-22.', 'Nhấn S1: H1 sáng và tự giữ.', 'Nhấn S2: H1 tắt.', 'Thử sai để nhớ: dừng, chạm PLC1, đổi tiếp điểm {I0.1} sang thường đóng rồi chạy lại. Nhấn S1 mà H1 không sáng: đó là lỗi hay gặp nhất.'] },
    { id: 'l5', t: 'SET và RESET (đặt và xóa)', goal: 'Giữ trạng thái ngõ ra mà không cần nhánh tự giữ.',
      io: [['I0.0', 'S1 – nút', 'Bật'], ['I0.1', 'S2 – nút', 'Tắt'], ['Q0.0', 'H1 – đèn', 'Ngõ ra được SET/RESET']],
      lad: { rungs: [{ s: [{ k: 'no', a: 'I0.0' }], o: { k: 'set', a: 'Q0.0' } }, { s: [{ k: 'no', a: 'I0.1' }], o: { k: 'rst', a: 'Q0.0' } }] },
      read: ['Mạch 1: nhấn S1 thì {Q0.0} được SET lên ON và giữ luôn, thả nút vẫn ON.', 'Mạch 2: nhấn S2 thì {Q0.0} bị RESET về OFF.', 'Nhấn cả hai cùng lúc: mạch nằm DƯỚI (RESET) được thực hiện sau nên thắng, ngõ ra OFF. Đặt RESET ở dưới là cách làm an toàn.'],
      tip: 'Mỗi lệnh SET phải có lệnh RESET tương ứng ở đâu đó, nếu không ngõ ra sẽ ON mãi. Khi mất điện rồi có lại, ngõ ra được SET thường trở về OFF (trừ khi dùng vùng nhớ giữ).',
      tr: { i: [{ n: 0, d: 'nn', tag: 'S1', color: 'green' }, { n: 1, d: 'nn', tag: 'S2', color: 'red' }], q: [{ n: 0, color: 'green' }] },
      steps: ['Bấm ▶ Chạy.', 'Nhấn S1: H1 sáng và giữ.', 'Nhấn S2: H1 tắt.', 'Chạm PLC1 để xem cách hãng này vẽ lệnh SET/RESET.'] },
    { id: 'l6', t: 'Đảo chiều động cơ có khóa chéo', goal: 'Không bao giờ để 2 contactor thuận và ngược cùng đóng (chập pha).',
      io: [['I0.0', 'S1 – nút Thuận', ''], ['I0.1', 'S2 – nút Ngược', ''], ['I0.2', 'S3 – nút Dừng', ''], ['Q0.0', 'H1 – contactor thuận', ''], ['Q0.1', 'H2 – contactor ngược', '']],
      lad: { rungs: [{ s: [{ k: 'par', b: [[{ k: 'no', a: 'I0.0' }], [{ k: 'no', a: 'Q0.0' }]] }, { k: 'nc', a: 'I0.2' }, { k: 'nc', a: 'Q0.1' }], o: { k: 'coil', a: 'Q0.0' } }, { s: [{ k: 'par', b: [[{ k: 'no', a: 'I0.1' }], [{ k: 'no', a: 'Q0.1' }]] }, { k: 'nc', a: 'I0.2' }, { k: 'nc', a: 'Q0.0' }], o: { k: 'coil', a: 'Q0.1' } }] },
      read: ['Mỗi chiều là một mạch tự giữ giống bài 3.', 'Tiếp điểm thường đóng {Q0.1} nằm trong mạch thuận và {Q0.0} nằm trong mạch ngược: chiều này đang chạy thì chiều kia không thể ON. Đó là khóa chéo (liên động).', 'Muốn đổi chiều: nhấn Dừng trước rồi mới nhấn chiều còn lại.'],
      tip: 'Ngoài thực tế phải khóa chéo CẢ phần cứng: tiếp điểm phụ thường đóng của contactor này nối tiếp cuộn dây contactor kia. Phòng khi tiếp điểm contactor bị dính, chỉ khóa trong chương trình là chưa đủ.',
      tr: { i: [{ n: 0, d: 'nn', tag: 'S1', color: 'green' }, { n: 1, d: 'nn', tag: 'S2', color: 'green' }, { n: 2, d: 'nn', tag: 'S3', color: 'red' }], q: [{ n: 0, color: 'green' }, { n: 1, color: 'yellow' }] },
      steps: ['Bấm ▶ Chạy, nhấn S1: H1 (thuận) sáng.', 'Nhấn S2: H2 không sáng vì bị khóa chéo.', 'Nhấn S3 dừng rồi nhấn S2: H2 sáng.'] },
    { id: 'l7', t: 'Timer trễ đóng (TON)', goal: 'Cho ngõ ra ON sau một khoảng thời gian.',
      io: [['I0.0', 'S1 – nút Start', ''], ['I0.1', 'S2 – nút Stop', ''], ['M0', 'Bit nhớ (rơ le trung gian ảo)', 'Ghi nhớ đã nhấn Start'], ['T0', 'Timer 5 giây', ''], ['Q0.0', 'H1 – đèn chờ', 'Sáng ngay'], ['Q0.1', 'H2 – đèn', 'Sáng sau 5 s']],
      lad: { rungs: [{ s: [{ k: 'par', b: [[{ k: 'no', a: 'I0.0' }], [{ k: 'no', a: 'M0' }]] }, { k: 'nc', a: 'I0.1' }], o: { k: 'coil', a: 'M0' } }, { s: [{ k: 'no', a: 'M0' }], o: { k: 'ton', a: 'T0', t: 5 } }, { s: [{ k: 'no', a: 'M0' }, { k: 'nc', a: 'T0' }], o: { k: 'coil', a: 'Q0.0' } }, { s: [{ k: 'no', a: 'T0' }], o: { k: 'coil', a: 'Q0.1' } }] },
      read: ['Mạch 1: tự giữ bằng bit nhớ {M0} (bit nhớ dùng như rơ le trung gian, không ra chân nào).', 'Mạch 2: khi {M0} ON, timer {T0} bắt đầu đếm thời gian. Đủ 5 giây thì tiếp điểm của timer đóng.', 'Mạch 3: đang chờ thì đèn {Q0.0} sáng. Mạch 4: hết giờ thì {Q0.1} sáng.', 'Nếu điều kiện vào timer mất giữa chừng, TON xóa về 0 và đếm lại từ đầu. Vì vậy phải tự giữ {M0} trước khi đưa vào timer.'],
      tip: 'Cách ghi thời gian khác nhau giữa các hãng, xem bảng địa chỉ ở trên. Phần lớn timer có đơn vị 100 ms, nên 5 giây phải ghi là 50.',
      tr: { i: [{ n: 0, d: 'nn', tag: 'S1', color: 'green' }, { n: 1, d: 'nn', tag: 'S2', color: 'red' }], q: [{ n: 0, color: 'yellow' }, { n: 1, color: 'green' }] },
      steps: ['Bấm ▶ Chạy, nhấn S1: H1 (chờ) sáng ngay.', 'Đợi 5 giây: H1 tắt, H2 sáng.', 'Chạm PLC1 khi đang chạy để xem timer đếm.', 'Nhấn S2 để dừng, thử đổi thời gian thành 3 giây.'] },
    { id: 'l8', t: 'Timer trễ ngắt (TOF) và cách làm khi PLC không có TOF', goal: 'Cho ngõ ra chạy thêm một lúc sau khi tắt (ví dụ quạt làm mát chạy thêm 10 giây).',
      io: [['I0.0', 'S1 – công tắc xoay', 'Bật máy'], ['Q0.0', 'H1 – đèn máy chạy', ''], ['Q0.1', 'H2 – quạt làm mát', 'Tắt sau 10 s'], ['T0', 'Timer 10 giây', '']],
      lad: { rungs: [{ s: [{ k: 'no', a: 'I0.0' }], o: { k: 'coil', a: 'Q0.0' } }, { s: [{ k: 'no', a: 'I0.0' }], o: { k: 'tof', a: 'T0', t: 10 } }, { s: [{ k: 'no', a: 'T0' }], o: { k: 'coil', a: 'Q0.1' } }] },
      ladNoTof: { rungs: [{ s: [{ k: 'no', a: 'I0.0' }], o: { k: 'coil', a: 'Q0.0' } }, { s: [{ k: 'par', b: [[{ k: 'no', a: 'I0.0' }], [{ k: 'no', a: 'Q0.1' }]] }, { k: 'nc', a: 'T0' }], o: { k: 'coil', a: 'Q0.1' } }, { s: [{ k: 'nc', a: 'I0.0' }, { k: 'no', a: 'Q0.1' }], o: { k: 'ton', a: 'T0', t: 10 } }] },
      read: ['TOF: khi ngõ vào ON thì tiếp điểm timer ON ngay; khi ngõ vào OFF, tiếp điểm còn giữ thêm đủ thời gian đặt rồi mới OFF.', 'Mitsubishi, Delta và Omron không có lệnh TOF. Cách làm thay: quạt {Q0.1} tự giữ; khi tắt {I0.0} thì cho timer TON {T0} chạy; hết 10 giây tiếp điểm thường đóng {T0} cắt tự giữ.'],
      noTofNote: 'Model này không có TOF nên sơ đồ bên dưới dùng cách làm thay bằng TON.',
      tip: 'Chọn model Siemens hoặc LS ở đầu trang để xem bản dùng lệnh TOF thật; chọn Mitsubishi để xem cách làm thay.',

/* đổi {I0.0} … trong chuỗi sang địa chỉ của model */
const gpAddr = (M, a) => a === '#CLK' ? (M.clock ? M.clock.replace(/"/g, '') : 'BLINK (xung 1 Hz)') : a === '#ONE' ? (M.one === 'TRUE' ? 'TRUE' : M.one) : M.name(a);
const gpFill = (M, s) => String(s).replace(/\{([^}]+)\}/g, (_, a) => gpAddr(M, a));

/* bàn thực hành: nguồn, aptomat, PLC, nút ở ngõ vào, đèn ở ngõ ra, đã đấu sẵn */
function plcTrainer(model, L) {
  const t = mk('ind');
  const src = t.add('nguon1', 40, 40), q1 = t.add('mcb1', 250, 30, { tag: 'Q1' });
  const lad = JSON.parse(JSON.stringify(!PLC_MODELS[model].tof && L.ladNoTof ? L.ladNoTof : L.lad));
  const plc = t.add('plc', 40, 380, { tag: 'PLC1', model, lang: 'lad', lad });
  t.w(src, 'L', q1, '1', C.L1); t.w(q1, '2', plc, 'L', C.L1); t.w(src, 'N', plc, 'N', C.N); t.w(src, 'PE', plc, 'PE', C.PE);
  t.w(plc, 'M', plc, '1M', 'bluewhite');
  let prev = null;
  L.tr.i.forEach(d => {
    const x = 280 + d.n * 90, id = t.add(d.d, x, 200, Object.assign({ tag: d.tag }, d.color ? { color: d.color } : {}));
    const a = d.nc ? '21' : '13', b = d.nc ? '22' : '14';
    t.w(prev ? prev[0] : plc, prev ? prev[1] : 'L+', id, a, 'darkblue'); prev = [id, a];
    t.w(id, b, plc, 'I0.' + d.n, 'violet');
  });
  t.w(q1, '2', plc, '1L', 'red'); t.w(plc, '1L', plc, '2L', 'red');
  let pn = null;
  L.tr.q.forEach((d, j) => {
    const id = t.add('den', 30 + j * 90, 700, { color: d.color, tag: 'H' + (j + 1) });
    t.w(plc, 'Q0.' + d.n, id, 'X1', 'red');
    t.w(id, 'X2', pn || src, pn ? 'X2' : 'N', C.N); pn = id;
  });
  return t;
}

      <li><b>Ngõ ra số</b> (${esc(M.out(0))}…): loại Relay (tiếp điểm) hoặc Transistor, đóng tải.</li>
      <li><b>Ngõ vào analog</b> (${esc(M.ai(0))}…): đọc tín hiệu liên tục 4–20 mA hoặc 0–10 V từ cảm biến mức, áp suất, nhiệt độ.</li>
      <li><b>Cổng truyền thông</b>: nạp chương trình từ máy tính, nối màn hình HMI, biến tần.</li></ul>

  <section class="gsec" id="g-quet"><h2>2. Chu kỳ quét: PLC chạy chương trình thế nào?</h2>

  <section class="gsec" id="g-day"><h2>3. Đấu dây ngõ vào và ngõ ra</h2>
    <p>Bàn thực hành dưới đây đấu đúng theo chân của <b>${esc(M.n)}</b>: nút Start S1 thường mở, nút Stop S2 thường đóng, đèn H1 ở ngõ ra.</p>
    <figure class="gwire">${staticSVG(demo, 26)}<figcaption>Dây xanh đậm: +24 V (${esc(M.lab['L+'])}) · xanh sọc trắng: 0 V (${esc(M.lab.M)}) nối về chân chung ngõ vào ${esc(M.lab['1M'])} · tím: tín hiệu vào PLC · đỏ: 220 V cấp cho chân chung ngõ ra ${esc(M.lab['1L'])}, ${esc(M.lab['2L'])}.</figcaption></figure>
    <h4>Ngõ vào số (24 V DC)</h4>
    <ul class="gread"><li>Nút nhấn, công tắc: một đầu nối +24 V, đầu kia vào ngõ vào. Chân chung ngõ vào (${esc(M.lab['1M'])}) nối 0 V.</li>
      <li>Cảm biến 3 dây: <b>nâu</b> +24 V, <b>xanh dương</b> 0 V, <b>đen</b> là tín hiệu vào PLC.</li>
      <li>Cảm biến 2 dây 4–20 mA thì vào ngõ vào analog, xem bài 12.</li></ul>
    <table class="gtbl"><thead><tr><th>Loại cảm biến</th><th>Khi tác động, dây đen xuất ra</th><th>Chân chung ngõ vào (${esc(M.lab['1M'])}) nối</th></tr></thead><tbody>
      <tr><td><b>PNP</b> (phổ biến ở châu Âu, Siemens)</td><td>+24 V</td><td><b>0 V</b></td></tr>
      <tr><td><b>NPN</b> (phổ biến ở hàng Nhật, Hàn, Đài)</td><td>0 V</td><td><b>+24 V</b></td></tr></tbody></table>
    <p class="gtip">💡 Mẹo nhớ: dòng điện phải chạy qua ngõ vào. Cảm biến đẩy +24 V ra (PNP) thì chân chung phải là 0 V, và ngược lại. Một nhóm ngõ vào dùng chung một chân chung nên không trộn PNP và NPN trong cùng một nhóm.</p>
    <h4>Ngõ ra số</h4>
    <table class="gtbl"><thead><tr><th></th><th>Ngõ ra Relay (R)</th><th>Ngõ ra Transistor (T)</th></tr></thead><tbody>

      <tr><th>Tốc độ</th><td>Chậm, tiếp điểm có tuổi thọ</td><td>Nhanh, dùng phát xung điều khiển servo, step</td></tr></tbody></table>
    <ul class="gread"><li>Cấp nguồn cho tải vào chân chung ngõ ra (${esc(M.lab['1L'])}); tải nối từ ngõ ra về N (hoặc 0 V nếu tải DC).</li>
      <li>Ngõ ra PLC <b>không</b> đóng trực tiếp động cơ. Ngõ ra đóng cuộn dây contactor, contactor đóng động cơ.</li>
      <li>Tải cảm (cuộn dây) nên có mạch dập: RC cho AC, diode cho DC, giúp tiếp điểm ngõ ra bền hơn.</li></ul>
  </section>

  <section class="gsec" id="g-bai"><h2>5. Bài học sơ đồ thang (LAD)</h2>
    <p>Sơ đồ thang vẽ giống mạch điện rơ le: thanh nguồn bên trái, các tiếp điểm ở giữa, cuộn dây hoặc khối lệnh bên phải. Mỗi hàng là một <b>mạch</b> (${key === 's71200' ? 'Network' : key === 's7200' ? 'Network' : 'Rung'}). Sơ đồ dưới đây vẽ theo ký hiệu của ${esc(GM_LABEL[key])}; bấm <b>Thực hành</b> để mở bàn đấu sẵn và chạy thử.</p>

  <section class="gsec" id="g-qt"><h2>6. Quy trình làm một bài PLC từ đầu đến cuối</h2>
    <ol class="gsteps">
      <li><b>Viết yêu cầu bằng lời.</b> Ví dụ: "Nhấn Start động cơ chạy, nhấn Stop hoặc quá tải thì dừng, quá tải thì đèn đỏ nháy."</li>
      <li><b>Lập bảng địa chỉ vào/ra (bảng I/O).</b> Mỗi nút, cảm biến một ngõ vào; mỗi contactor, đèn một ngõ ra. Ghi rõ nút là thường mở hay thường đóng.</li>
      <li><b>Vẽ sơ đồ đấu dây</b> theo bảng I/O, chọn PNP/NPN cho chân chung, cấp nguồn cho chân chung ngõ ra.</li>
      <li><b>Viết chương trình LAD</b>: mỗi ngõ ra một mạch, dùng bit nhớ M cho các trạng thái trung gian.</li>
      <li><b>Chạy mô phỏng</b> (như app này, hoặc chế độ mô phỏng của phần mềm hãng) để kiểm tra logic.</li>
      <li><b>Nạp chương trình và thử không tải</b>: cắt nguồn động lực, chỉ thử mạch điều khiển, xem đèn ngõ vào/ra.</li>
      <li><b>Chạy có tải</b>, theo dõi online sơ đồ thang, kiểm tra dừng khẩn, quá tải, khóa chéo.</li>
      <li><b>Lưu chương trình, ghi chú tên các địa chỉ</b> và in bảng I/O dán trong cánh tủ.</li></ol>
  </section>

  <section class="gsec" id="g-at"><h2>8. An toàn khi làm PLC</h2>
    <ul class="gread">
      <li>Cắt nguồn, khóa aptomat và treo biển trước khi đấu hoặc sửa dây. Ngõ ra Relay có thể đang mang điện 220 V từ chân chung.</li>
      <li><b>Dừng khẩn (E-Stop) phải cắt bằng phần cứng</b>: nối tiếp trực tiếp vào nguồn cuộn dây contactor, đồng thời báo thêm một tiếp điểm về PLC. Không chỉ dựa vào chương trình, vì PLC có thể treo hoặc chương trình có thể sai.</li>
      <li>Khóa chéo thuận/ngược, sao/tam giác làm <b>cả phần cứng</b> (tiếp điểm phụ thường đóng của contactor) lẫn trong chương trình.</li>
      <li>Rơ le nhiệt: tiếp điểm 95-96 nối tiếp cuộn dây contactor để cắt trực tiếp, tiếp điểm 97-98 báo về PLC.</li>
      <li>Thử chương trình bằng mô phỏng, rồi thử không tải, cuối cùng mới chạy có tải. Có người đứng cạnh nút dừng khẩn khi chạy thử lần đầu.</li>
      <li>Sao lưu chương trình đang chạy trước khi sửa. Hạn chế sửa trực tiếp (online edit) khi máy đang chạy nếu chưa chắc chắn.</li></ul>
  </section>

function importJSON(text) {
  try {
    const o = JSON.parse(text);
    if (!o || !MODES[o.mode] || !Array.isArray(o.parts) || !Array.isArray(o.wires)) throw 0;
    o.parts = o.parts.filter(p => p && P[p.type] && typeof p.id === 'string').map(p => ({ ...p, x: +p.x || 0, y: +p.y || 0, tag: String(p.tag || '').slice(0, 8) }));
    o.wires = o.wires.filter(w => w && typeof w.a === 'string' && typeof w.b === 'string').map(w => ({ id: String(w.id), a: w.a, b: w.b, c: typeof w.c === 'string' && (/^#[0-9a-f]{6}$/i.test(w.c) || /^[a-zA-Z]{2,12}$/.test(w.c)) ? w.c : 'red' }));
    const pr = newProj(o.mode, o); pr.name = String(o.name || 'Dự án nhập').slice(0, 60); pr.n = Math.max(+o.n || 1, pr.parts.length + pr.wires.length + 2);
    proj = pr; saveProj(); return pr;
  } catch (e) { return null; }
}

function heroAnim() {

}

  const t = e.target.closest('[data-tpl],[data-new],[data-open],[data-export],[data-delp],#impb,#copyb');
  if (!t) return;
  if (t.dataset.tpl !== undefined) { const tp = TPL[+t.dataset.tpl]; const pr = newProj(tp.mode, tp); pr.tpl = { name: tp.name, steps: tp.steps }; delete pr.steps; delete pr.desc; openEditor(pr); saveProj(); return; }
  if (t.dataset.new) { openEditor(newProj(t.dataset.new)); saveProj(); return; }
  if (t.dataset.open) { const x = listProjects().find(p => p.id === t.dataset.open); if (x) openEditor(x); return; }
  if (t.dataset.export) { const x = listProjects().find(p => p.id === t.dataset.export); if (!x) return; const { tpl, ...o } = x; $('#expbox').hidden = false; $('#expt').value = JSON.stringify(o); $('#expbox').scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.delp) {
    if (t.dataset.sure) { LS.set('xdd.projects', listProjects().filter(p => p.id !== t.dataset.delp)); route(); }
    else { t.dataset.sure = 1; t.textContent = 'Chắc chắn?'; setTimeout(() => { if (t.isConnected) { delete t.dataset.sure; t.textContent = 'Xoá'; } }, 3000); }
    return;
  }
  if (t.id === 'impb') { const pr = importJSON($('#impt').value); if (pr) openEditor(pr); else $('#impmsg').textContent = 'Mã dự án không hợp lệ.'; return; }
  if (t.id === 'copyb') { const v = $('#expt').value; $('#expt').select(); navigator.clipboard.writeText(v).then(() => $('#copymsg').textContent = 'Đã sao chép.', () => $('#copymsg').textContent = 'Hãy chọn và sao chép thủ công.'); }
});
document.addEventListener('change', e => { if (e.target.id === 'impf' && e.target.files[0]) e.target.files[0].text().then(t => { $('#impt').value = t; }); });
document.addEventListener('input', e => {
  if (e.target.id === 'palq') { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('#psheet .pi').forEach(b => b.hidden = q && !b.dataset.s.includes(q)); document.querySelectorAll('#psheet .pg').forEach(g => g.hidden = !g.querySelector('.pi:not([hidden])')); return; }
  if (e.target.id === 'q') { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('[data-s]').forEach(c => c.hidden = q && !c.dataset.s.includes(q)); } });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-gm],[data-gtry],[data-gq],[data-goto],[data-gmset],[data-vmset],[data-vgm],[data-vtry]'); if (!t) return;
  if (t.dataset.vgm) { const y = window.scrollY; LS.set('xdd.vmodel', t.dataset.vgm); $('#main').innerHTML = pageVFD(); window.scrollTo(0, y); return; }
  if (t.dataset.vtry) { const key = vmKey(), M = VFD_MODELS[key], i = GV.lessons.findIndex(x => x.id === t.dataset.vtry), Ls = GV.lessons[i];
    const tp = fin(vfdBench(Object.assign({ vm: key }, Ls.bench)), { name: 'Bài biến tần ' + (i + 1) + ': ' + Ls.t }), pr = newProj('ind', tp);
    pr.tpl = { name: tp.name, steps: [gvSet(M, Ls.set).map(r => r[0] + ' = ' + r[2]).join(' · '), ...Ls.steps.map(s => gvLab(M, s))] }; openEditor(pr); saveProj(); return; }
  if (t.dataset.vmset) { LS.set('xdd.vmodel', t.dataset.vmset); return; }
  if (t.dataset.gmset) { LS.set('xdd.gmodel', t.dataset.gmset); return; }
  if (t.dataset.gm) { const y = window.scrollY; LS.set('xdd.gmodel', t.dataset.gm); $('#main').innerHTML = pagePLC(); window.scrollTo(0, y); return; }
  if (t.dataset.goto) { const el = document.getElementById(t.dataset.goto); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.gq !== undefined) { const q = (t.dataset.qs === 'v' ? GV.quiz : GP.quiz)[+t.dataset.gq], box = t.closest('.qz'); box.querySelectorAll('.qopt').forEach(b => { b.classList.toggle('ok', +b.dataset.o === q[2]); b.classList.toggle('bad', b === t && +b.dataset.o !== q[2]); }); box.querySelector('.qex').hidden = false; return; }
  if (t.dataset.gtry) {
    const key = gmKey(), M = PLC_MODELS[key], i = GP.lessons.findIndex(x => x.id === t.dataset.gtry), L = GP.lessons[i]; let pr;
    if (L.tpl) { const tp = TPL.find(x => x.key === L.tpl); pr = newProj(tp.mode, tp); pr.parts.forEach(p => { if (p.type === 'plc') p.model = key; }); pr.tpl = { name: tp.name, steps: tp.steps.map(s => s.replace(/AI0/g, M.ai(0))) }; }
    else { const tp = fin(plcTrainer(key, L), { name: 'Bài PLC ' + (i + 1) + ': ' + L.t }); pr = newProj('ind', tp); pr.tpl = { name: tp.name, steps: L.steps.map(s => gpFill(M, s)) }; }
    delete pr.steps; delete pr.desc; delete pr.key; delete pr.cat; delete pr.lvl; openEditor(pr); saveProj();
  }
});
window.addEventListener('hashchange', route);
bindEditor();
route();
}

</script>
